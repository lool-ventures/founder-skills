# Shared session for the cap-table cowork-harness scenarios.
# LOCKED CONSTRAINTS (see docs/internal/2026-06-16-cap-table-harness-test-plan.md §0.4):
#  1. Mount the WHOLE founder-skills plugin (../../../ resolves to the plugin root, NOT skills/cap-table/),
#     so the repaired skillHash (B0) covers cap-table-rules.json + references/ + scripts/ — a rule-pack
#     edit then trips `verify-cassettes --staleness`. Narrowing this mount reintroduces a rule-pack false-green.
#  2. Repo-relative path (resolves from this session file's dir), so the committed session + cassettes
#     resolve in CI with no absolute /Users/... leak.
model: claude-sonnet-4-6        # parity with prior cowork runs
plugins:
  local_plugins:
    - ../../../                 # founder-skills plugin root (whole plugin)
  enabled:
    - founder-skills@local
