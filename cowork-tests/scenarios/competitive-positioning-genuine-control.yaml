name: competitive-positioning-genuine-control
session: ../sessions/default.yaml
fidelity: cowork
on_unanswered: first   # Gate 1's proceed path is option 1 ("Looks good")
skills: [competitive-positioning]

# Adversarial competitor-set verification (Step 3.5) — NEGATIVE control (FPR tripwire).
# The prompt seeds Cadence with ONLY three GENUINE FSM competitors and no false
# positive. The wired COMPETITOR_VERIFICATION dispatch must NOT over-flag any of them:
# summary.flagged == 0, and the transcript must NOT carry a "not a genuine competitor"
# challenge against any of the three. If the adversary over-flags a real rival here,
# this scenario fails loudly — that is the intended tripwire (over-flagging erodes
# founder trust worse than the original false-positive bug).
prompt: |
  I'm the founder of Cadence, a US seed-stage B2B SaaS company selling field-service
  scheduling and dispatch software to SMB service businesses (HVAC, plumbing, electrical).
  Use the competitive-positioning skill to map our competitive landscape and moats. Use
  exactly these three competitors — do not add others: ServiceTitan, Jobber, and Housecall
  Pro. Then produce the positioning report.

assert:
  - result: success
  # Every planned step (TaskCreate/TaskUpdate) ran to completion — catches a run that produced
  # the deliverable but stranded steps, which result:success alone misses.
  - all_tasks_completed: true
  - file_exists: outputs/artifacts/competitive-positioning-cadence/competitor_verification.json
  # The tripwire: none of the three genuine FSM competitors is flagged.
  - artifact_json:
      artifact: outputs/artifacts/competitive-positioning-cadence/competitor_verification.json
      path: summary.flagged
      equals: 0
  # No "not a genuine competitor" challenge raised against any of the three.
  - transcript_not_matches: '(servicetitan|jobber|housecall)[\s\S]{0,160}(not (a |genuine )?(competitor|competing|compete)|does.?n.?t (really |genuinely )?compete|challenge_removal)'
  - subagent_dispatched: 'competitive-positioning'
  # --- fleet contract asserts (mirror the smoke) ---
  - skill_triggered: '(founder-skills:)?competitive-positioning$'
  # Question-terminal flow (allow_stall below): may stall on the Gate-1 challenge before emitting a
  # deliverable link, so assert link resolution only if one is present (0.27.0 fails the bare form on
  # zero links). Deliverables are covered by the artifact/file asserts above.
  - computer_links_resolve_if_present: true
  - no_delete_in_outputs: true
  - subagent_tool_absent: 'Bash'
  - allow_stall: true
  - questions_count_max: 8
  - dispatch_count_max: 12
  - max_turns: 160
  - tool_calls_max: 150
  - no_unexpected_files:
      - 'outputs/artifacts/competitive-positioning-cadence/**'
      - 'outputs/artifacts/founder-context-cadence.json'
      - 'outputs/Cadence_Competitive_*'
  # GATE FLOOR. `questions_count_max` above is a CEILING — it caps interruption but has never once
  # asserted that the skill asked anything at all. A run that silently skips its confirmation gates and
  # assumes the answers produces a well-formed report, a green suite, and a founder who was never
  # consulted. Measured: a committed cassette for this fleet once froze exactly that (0 gates) and went
  # green for weeks. `gate_answers_delivered` alone does NOT close it — it passes VACUOUSLY when zero
  # gates fire, which is why the two are always paired.
  # Floor is deliberately 1, well BELOW the count observed at record time: gate firing is
  # model-dependent (the same batch saw one cap-table lane fire the founder-context pack and another
  # skip it), so a floor set AT the observed count converts ordinary variance into a red suite. This
  # asserts the property — "it asked" — not the model's exact behaviour.
  - gate_answers_delivered: true
  - gate_answer_count_min: 1
