name: cap-table-antihallucination
session: ../sessions/term-sheet-blank.yaml
fidelity: cowork
on_unanswered: fail

# P0-b — anti-hallucination negative (cap-table's signature property). Synthetic term sheet (ACMECORP)
# whose EXCLUSIVITY clause has a template BLANK ("during a period of  days") — no number. A
# hallucinating extractor fills "45 days"; the correct extraction is null/absent. Founder framing
# matches the doc's company (Acmecorp) + complete context to suppress the founder-context gate.
prompt: |
  I'm a founder at Acmecorp Inc., a US Delaware seed-stage B2B SaaS company. I've uploaded a Series A
  term sheet I received. Please review the uploaded term sheet — extract its terms and tell me what to
  watch out for.

answers:
  - when_question: ".*"
    choose: first

assert:
  - result: success
  # The signature negative, asserted POSITIVELY: the skill must explicitly flag the exclusivity field
  # as blank/absent — proving it recognized the absence instead of fabricating a value. (A
  # transcript_not_matches on "45" is too brittle: the skill legitimately COACHES "negotiate 30-45
  # days" once a value is filled in, which is correct advice, not a hallucinated extraction.)
  # Phrasing varies run-to-run ("___ days", "nothing filled in", "the number of days is blank",
  # "not specified"), so the alternation is broad and the window wide — the skill ALWAYS flags the blank;
  # only the wording moves.
  - transcript_matches: 'exclusivit[\s\S]{0,150}(blank|___|nothing (is )?(filled|specified)|(not|nothing) filled|filled in|no (number|value|duration|days)|missing|not (specified|stated|provided|given)|empty|left blank|unspecified)'
  - transcript_no_host_path: true
