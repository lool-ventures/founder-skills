name: cap-table-lane3-freeform
session: ../sessions/lane3-freeform.yaml
fidelity: cowork
on_unanswered: fail
skills: [cap-table]                # 0.5.0: scope the staleness hash to this skill + shared roots (F-6)

# Lane-3 freeform spreadsheet — the runtime-distinct surface no other cassette covers: the
# SPREADSHEET_STRUCTURE_DETECTION sub-agent reads the compacted cell grid and classifies blocks
# (founders / SAFEs) AND must classify the non-mappable "Returns" exit-modeling tab as an ignore
# type rather than inventing a block_type. All data is SYNTHETIC (Cadence / invented founders).
prompt: |
  I'm a founder at Cadence, a US Delaware C-corp (seed-stage B2B SaaS). I've uploaded our cap
  table as a freeform Excel workbook: a "Cap Table" tab with our two founders (Maya Gold and Ofer
  Tal) and their common share counts, a "SAFEs" tab with our one outstanding SAFE (Foobar Capital
  LLC), and a "Returns" tab with exit-scenario modeling. We have NO employee option pool.

  The "Discount" value of 0.2 in the SAFEs tab is a 20% discount RATE (the investor converts at 80%
  of the priced-round price), not a price multiplier.

  Please reconstruct the cap table from the spreadsheet (Lane 3 freeform). For the review, model
  ONLY the SAFE's cap-implied ownership snapshot — no priced-round or Series A scenarios — and give
  me the full cap-table review with the interactive explorer built on that snapshot.

# The prompt pre-answers the fields the cap-table skill gates on for this fixture (option-pool existence
# + which scenario to model), so the run is intended to be GATE-CLEAN — like the Lane-4 safe-full scenario.
# The `answers` below are a backstop only, anchored on a stable FRAGMENT of the canonical label (SKILL.md
# "Canonical gate phrasing") — never the full label, never blanket `first`.
# NOTE: there is intentionally NO discount anchor — the freeform discount rate-vs-multiplier gate was
# removed (the convention is deterministic; SKILL.md no longer raises it, surfacing the conversion as a
# non-blocking note instead), so that gate never fires.
answers:
  - when_question: "scenarios?.*model"   # optional s — see A-05: count-dependent anchors die mid-batch
    # multiSelect gate; prefix "Cap-implied" (NOT "implied" — matching is boundary-anchored startsWith,
    # not substring) uniquely selects "Cap-implied SAFE snapshot". Backstop only: the prompt pre-answers
    # this gate, so it is normally gate-clean.
    choose: ["Cap-implied"]
  - when_question: "option pool"
    choose: "No option pool"        # canonical label (SKILL.md); the prompt also pre-suppresses this gate

assert:
  # Lane-3 ran end-to-end and produced its equity artifacts from the freeform sheet.
  - result: success
  # Every planned step (TaskCreate/TaskUpdate) ran to completion — catches a run that produced
  # the deliverable but stranded steps, which result:success alone misses.
  # No `all_tasks_completed` here: nothing in this skill asks the agent for a task list, so the
  # assert is satisfiable only by chance and a losing run blocks a paid record rather than
  # reporting a defect. To assert it, mandate a tracker in SKILL.md first, then pair it with
  # `task_count_min: 1` — see financial-model-review-smoke.yaml.
  - file_exists: outputs/artifacts/cap-table-cadence/inputs.json
  - file_exists: outputs/artifacts/cap-table-cadence/instruments.json
  # Deliverables promoted to the outputs root (manifest-backed → survives replay; parity).
  - user_visible_artifact: outputs/Cadence_Cap_Table_Explorer.html
  # Hard-fact extraction from the freeform grid (unique to this layer — not deterministic-pytest).
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/inputs.json
      path: founders.0.common_shares
      equals: 4000000
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/instruments.json
      path: safes.0.post_money_valuation_cap
      equals: 10000000
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/instruments.json
      path: safes.0.discount_multiplier
      equals: 0.8
  # The SPREADSHEET_STRUCTURE_DETECTION (+ Context-B) sub-agents were dispatched.
  - subagent_dispatched: 'cap-table'
  # Uploaded input is read-only — the mapper must READ the uploaded freeform workbook, never mutate it.
  # Guard the upload's content hash (0.29.0 captures uploads as a read-only input root, so input_unmodified
  # now reaches the upload lanes). Evaluable only after a re-record captures the upload root.
  - input_unmodified: 'uploads/**'
  # host-path posture: hostloop exposes real host paths by design; the leak class is covered
  # by the container-tier host-path-canary scenario + the privacy scan's path class on cassettes.
  # --- fleet contract asserts (adopted at the 0.24.0 pin; budgets tightened from discovery actuals) ---
  # The pipeline entered through the Skill tool (prefix-tolerant; id shape confirmed at discovery).
  - skill_triggered: '(founder-skills:)?cap-table$'
  # Every computer:// deliverable link must resolve, and at least one must be present. The strict
  # form is deliberate: the delivery step requires naming and linking each deliverable, so a run
  # with no link handed the founder unlabelled cards.
  - computer_links_resolve: true
  # No delete under outputs/ (live-lane key; replay skips it loudly).
  - no_delete_in_outputs: true
  # Dispatch contract: sub-agents declare no Bash (agents/*.md) — regression tripwire.
  - subagent_tool_absent: 'Bash'
  # NO gate assertion here, deliberately — this lane is GATE-CLEAN BY DESIGN (see the header note).
  # `gate_answers_delivered` was removed rather than paired with a presence companion. This no longer
  # argues against the linter: harness 1.20.0 rewrote `vacuous-gate-assert` (Gotcha 19), which now
  # names dropping the key as the correct remedy for a scenario that legitimately expects zero, and
  # tells you so instead of only saying "add a presence companion". Earlier versions named just the
  # add-a-companion branch, which is why this note used to carry the counter-argument in full.
  # Why zero is correct here: the cap-base confirmation gate is scoped to a `model_reconstructed`
  # base. Lane 3's freeform emit auto-stamps `deterministic_mapped`, which SKILL.md exempts — the
  # mapping is deterministic, so there is no interpretation to confirm. The prompt also pre-answers
  # the option-pool and scenario-choice fields. A `gate_answer_count_min: 1` here was measured
  # FAILING a healthy live run (0 gates, 22 artifacts, result=success), and `record` correctly
  # refused to freeze it.
  # Usability budget: gates asked before value (observed + headroom, from discovery).
  - questions_count_max: 8
  # Author-chosen dispatch budget (production has NO Task-fan-out cap; this is an
  # efficiency tripwire, not a platform mirror). tightened from discovery actuals (observed x1.5).
  - dispatch_count_max: 6
  # Efficiency budgets — generous ceilings; tightened to observed x1.5 post-record.
  - max_turns: 115
  - tool_calls_max: 110
  # Stray-file guard (new-files-only; overwrite-in-place is covered by producer stamps).
  # Allowlist = artifact namespace (incl. handoff/**) + founder-context sidecar + promoted
  # deliverables. Pre-0.24 cassettes exclude loudly (no preRunPaths). tightened from discovery actuals (observed x1.5).
  - no_unexpected_files:
      - 'outputs/artifacts/cap-table-cadence/**'
      - 'outputs/artifacts/founder-context-cadence.json'
      - 'outputs/Cadence_*'

  # NO INTERNAL FILENAME REACHES A DELIVERED DOCUMENT (harness 1.24.0 `artifact_text`).
  #
  # WHY THIS EXISTS. A leak of this class was shipped to a founder: an internal name appeared in
  # the delivered `report.json` and NOT in `report.md`, so the fix looked complete. The rule that
  # follows is "scan every delivered surface", which is why there is one entry per document below
  # rather than one for the report — `artifact` is a LITERAL PATH, not a glob, by design (a glob
  # would be an exhaustive claim over the manifest's file set, which this key cannot make).
  #
  # THE CARVE-OUT IS DELIBERATE AND NARROW. `metadata.produced_by` (and competitive-positioning's
  # `_produced_by`, hence the `_?`) is a provenance stamp in a machine-read artifact, ruled
  # legitimate 2026-08-18. Everything else matching `<name>.py` is a leak. The lookbehind is JS
  # regex — the harness compiles with `new RegExp(pattern, "i")`, so variable-width lookbehind is
  # available; note Python's `re` REJECTS this pattern, so a reproduce script needs a different form.
  #
  # SCOPE, AND WHAT IS DELIBERATELY NOT HERE:
  #   * `.html` is excluded — the brand theme's CSS custom properties (`--lool-azure`, `--font-body`)
  #     read as flags to a naive matcher, and the generated HTML bodies run 60-97 KB against the
  #     64 KiB body cap. `test_html_founder_text.py` scans HTML TEXT NODES structurally instead.
  #   * `checklist.json` is excluded — it carries a REAL, KNOWN leak of this class, logged at
  #     docs/internal/2026-08-18-checklist-json-founder-text-leak.md. Asserting here would red the
  #     lane on a defect that is tracked and deliberately not fixed in this change. Add it when
  #     that defect closes; until then this guard does NOT cover that surface.
  # Manifest-class: a body-less capture (over the cap, or a read-only/uploaded input) fails
  # EVIDENCE-UNAVAILABLE rather than passing, so this cannot green vacuously.
  - artifact_text:
      artifact: 'outputs/Cadence_Cap_Table.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/Cadence_Counsel_Packet.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/artifacts/cap-table-cadence/counsel_packet.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/artifacts/cap-table-cadence/report.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
