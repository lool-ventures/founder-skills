name: cap-table-note-conversion
session: ../sessions/default.yaml
fidelity: cowork
on_unanswered: first   # Lane-4 with complete inline data should be ~gate-clean; option-1 backstops any confirm gate (e.g. interest_rate_type)
skills: [cap-table]                # 0.5.0: scope the staleness hash to this skill + shared roots (F-6)

# Convertible-NOTE conversion, full pipeline (end-to-end), Lane 4 (conversational). Closes the cap-table
# coverage gap where the note path had ZERO LLM-in-the-loop coverage: the 7-branch enum is deterministic
# (pytest-covered in test_cap_table.py); THIS proves the runtime path — reconstruct a note from the
# conversation, then run note_conversion at a qualified financing (cap_conversion: cap beats discount).
# All data SYNTHETIC (Cadence / invented founders + numbers) — never real founder/company data.
prompt: |
  I'm raising a Series A for Cadence, a US Delaware C-corp (field-service scheduling SaaS), and I want
  the full cap-table review before I sign.

  Cap table today:
  - Founder Alex Stone: 4,000,000 common shares
  - Founder Sam Lee: 3,500,000 common shares
  - Option pool: 1,500,000 authorized, 500,000 issued, 1,000,000 unallocated

  Outstanding instrument: one convertible promissory note from Foobar Capital LLC — $500,000 principal,
  6% simple annual interest (interest converts to shares), issued 2025-06-01, maturing 2027-06-01, with
  an $8,000,000 valuation cap and a 20% discount. A "qualified financing" is any priced round raising at
  least $1,000,000.

  Incoming round: a $4,000,000 Series A priced round at a $16,000,000 pre-money valuation (this clears
  the qualified-financing threshold).

  Give me the full cap-table review — show how the convertible note converts at this round (cap vs
  discount) and the resulting dilution for each holder — and build the interactive explorer.

# No scripted answers: the asserts (note principal/valuation_cap extraction + as-converted FD shares > 0) do
# NOT depend on the "Company Capitalization" denominator choice (the denominator drives the conversion price
# at the financing, not the pre-financing FD snapshot or the extracted note fields). So on_unanswered:first
# (option 1 = the canonical fully-diluted pre-financing denominator) is the robust choice — it survives the
# label paraphrase that broke a "Fully-diluted" fragment anchor during re-record (Issue A).

assert:
  # End-to-end: the full pipeline ran and produced its deliverables (manifest-backed → survives replay).
  - result: success
  - user_visible_artifact: outputs/Cadence_Cap_Table_Explorer.html
  - file_exists: outputs/artifacts/cap-table-cadence/instruments.json
  - file_exists: outputs/artifacts/cap-table-cadence/scenarios.json
  # Hard-fact reconstruction of the NOTE from the conversation (unique to this layer — not deterministic-pytest).
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/instruments.json
      path: convertible_notes.0.principal
      equals: 500000
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/instruments.json
      path: convertible_notes.0.valuation_cap
      equals: 8000000
  # The note conversion ran into the as-converted cap state (structural; stable across re-records).
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/cap_state.json
      path: as_converted_totals.fully_diluted_shares
      gt: 0
  # Context-B coaching sub-agent dispatched.
  - subagent_dispatched: 'cap-table'
  - transcript_matches: 'note|convert|valuation cap|discount'
  # Boundary (live-only; skipped on the replay PR gate): no host path leaked into model-visible text.
  - transcript_no_host_path: true
