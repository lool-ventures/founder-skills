name: cap-table-safe-full
session: ../sessions/default.yaml
fidelity: cowork
on_unanswered: first   # the MANDATORY cap-base gate (S2) fires even with inline data; label-pin it + backstop variance gates with option 1
skills: [cap-table]                # 0.5.0: scope the staleness hash to this skill + shared roots (F-6)

# Known gates (canonical SKILL.md Gate Catalog phrasing), anchored on a stable fragment.
# The skill may bundle all three confirmation questions into ONE AskUserQuestion; script each
# explicitly so a bundle can't leave a gate to on_unanswered. multiSelect `choose` items must be
# EXACT option labels (a prefix like "Series A" is rejected — a scripted-but-unmatched answer
# hard-fails rather than falling back to on_unanswered:first).
answers:
  - when_question: "cap-table base"
    choose: "Confirmed"
  - when_question: "top up your option pool"
    choose: "No top-up planned"
  - when_question: "scenarios? should I model"   # optional s: a single-scenario run phrases this in the singular (A-05: a count-dependent anchor cost a full paid recording)
    choose: ["Series A priced round"]   # exact multiSelect label — selects the priced-round scenario

# P0-a — SAFE conversion, full pipeline (end-to-end smoke), Lane 4 (conversational).
# All data is SYNTHETIC (Cadence / invented founders + numbers) — never real founder/company data.
  # Jurisdiction + IIA pinned by LABEL, not position. `b752162` reordered the Gate Catalog's
  # jurisdiction row to `israeli | delaware | ...`, so `on_unanswered: first` now resolves to
  # "Israeli company" — the opposite of this prompt's US-Delaware company. Anchors are leading
  # substrings and are uniqueness-guarded: the full "Delaware (already flipped)" is required, since a
  # bare "Delaware" also prefixes "Delaware with Israeli subsidiary" and would be ambiguous.
  - when_question: "jurisdiction structure"
    choose: "Delaware (already flipped)"
  # Benign at slot 1 today ("No IIA grants" leads the row) — pinned anyway so the same reorder class
  # cannot un-benign it silently.
  - when_question: "IIA"
    choose: "No IIA grants"
prompt: |
  I'm raising a seed round for Cadence, a US Delaware C-corp (field-service scheduling SaaS), and I
  want the full cap-table review before I sign.

  Cap table today:
  - Founder Alex Stone: 4,000,000 common shares
  - Founder Sam Lee: 3,500,000 common shares
  - Option pool: 1,500,000 authorized, 500,000 issued, 1,000,000 unallocated

  Outstanding instrument: one post-money SAFE from Foobar Capital LLC — $500,000 on a $10,000,000
  post-money valuation cap with a 20% discount.

  Incoming round: a $4,000,000 Series A priced round at a $16,000,000 pre-money valuation.

  Give me the full cap-table review — show how the SAFE converts at the priced round and the
  resulting dilution for each holder — and build the interactive explorer.

assert:
  # End-to-end: the full pipeline ran and produced its deliverables (manifest-backed → survives replay).
  - result: success
  # No `all_tasks_completed` here: nothing in this skill asks the agent for a task list, so the
  # assert is satisfiable only by chance and a losing run blocks a paid record rather than
  # reporting a defect. To assert it, mandate a tracker in SKILL.md first, then pair it with
  # `task_count_min: 1` — see financial-model-review-smoke.yaml.
  - user_visible_artifact: outputs/Cadence_Cap_Table_Explorer.html
  - file_exists: outputs/artifacts/cap-table-cadence/report.json
  - file_exists: outputs/artifacts/cap-table-cadence/scenarios.json
  # The YC post-money denominator (Gotcha #1) was computed — structural, stable across re-records.
  - artifact_json:
      artifact: outputs/artifacts/cap-table-cadence/cap_state.json
      path: as_converted_totals.fully_diluted_shares
      gt: 0
  # Context-B coaching sub-agent dispatched (match by agentType/description).
  - subagent_dispatched: 'cap-table'
  # Context-B coaching hand-off: the coaching sub-agent WRITES its commentary to the
  # handoff file (file transport, not the message channel) with a paired non-error
  # result — guards the first leg of the "## Coaching Commentary" insertion chain.
  # Tier-agnostic + replay-checkable. NOTE: the hand-off filename is `coaching.md`
  # (raw markdown, wrapped by md_to_commentary.py). It was
  # `coaching_commentary_output.json` when the current cassettes were recorded, so this
  # assert FAILS under `--reassert` until the next re-record and passes after it — the
  # same expected-until-re-record class as the `input_unmodified` upload guards. Empirically
  # validated in the 2026-07-12 live hostloop run (a subagent Write to the handoff
  # file, non-error) — under the filename that run used.
  - subagent_file_write:
      path_suffix: coaching.md
  # Per-dispatch correlation: ties THIS dispatch's resolved type to ITS OWN delivered
  # write via parentToolUseId, which subagent_file_write (matching ANY sub-agent write)
  # cannot do.
  - subagent_dispatch_healthy:
      type: 'cap-table'
  - transcript_matches: 'dilution|conversion|ownership'
  # NO input_unmodified here, deliberately. This lane is CONVERSATIONAL: `session: default.yaml`
  # declares no `uploads:`, and the SAFE terms are inline in the prompt — there is no uploaded file to
  # guard. An `input_unmodified: 'uploads/**'` assert lived here and could never pass, now or after a
  # re-record: the glob matches nothing in the pre-run manifest, which the harness reports as
  # "matched no pre-run path(s) … nothing to verify" rather than a vacuous pass. It was invisible only
  # because `--reassert` refuses this scenario (answers drifted from the recording) before evaluating
  # anything. The upload-hash guard belongs on the lanes that actually declare an upload:
  # cap-table-antihallucination / -carta / -extract-safe / -lane3-freeform, financial-model-review-smoke.
  # host-path posture: hostloop exposes real host paths by design; the leak class is covered
  # by the container-tier host-path-canary scenario + the privacy scan's path class on cassettes.
  # --- fleet contract asserts (adopted at the 0.24.0 pin; budgets tightened from discovery actuals) ---
  # The pipeline entered through the Skill tool (prefix-tolerant; id shape confirmed at discovery).
  - skill_triggered: '(founder-skills:)?cap-table$'
  # Every computer:// deliverable link must resolve, and at least one must be present. The strict
  # form is deliberate: the delivery step requires naming and linking each deliverable, so a run
  # with no link handed the founder unlabelled cards.
  - computer_links_resolve: true
  # No delete under outputs/ (live-lane key; replay skips it loudly).
  - no_delete_in_outputs: true
  # Dispatch contract: sub-agents declare no Bash (agents/*.md) — regression tripwire.
  - subagent_tool_absent: 'Bash'
  # Scripted answers reached the model non-error whenever a gate fired (0.25.0: vacuous-passes
  # when zero gates fire, so it's safe despite model-dependent gating — see README pin note).
  - gate_answers_delivered: true
  # Usability budget: gates asked before value (observed + headroom, from discovery).
  - questions_count_max: 10
  # Author-chosen dispatch budget (production has NO Task-fan-out cap; this is an
  # efficiency tripwire, not a platform mirror). tightened from discovery actuals (observed x1.5).
  - dispatch_count_max: 6
  # Efficiency budgets — generous ceilings; tightened to observed x1.5 post-record.
  - max_turns: 140
  - tool_calls_max: 130
  # Stray-file guard (new-files-only; overwrite-in-place is covered by producer stamps).
  # Allowlist = artifact namespace (incl. handoff/**) + founder-context sidecar + promoted
  # deliverables. Pre-0.24 cassettes exclude loudly (no preRunPaths). tightened from discovery actuals (observed x1.5).
  - no_unexpected_files:
      - 'outputs/artifacts/cap-table-cadence/**'
      - 'outputs/artifacts/founder-context-cadence.json'
      - 'outputs/Cadence_*'
  # GATE FLOOR — the presence companion this lane was missing. `gate_answers_delivered` above passes
  # VACUOUSLY when zero gates fire, so on its own it is satisfied by a run that asked nothing. Floor is
  # deliberately 1, below the count observed at record time: gate firing is model-dependent, and a floor
  # set AT the observed count turns ordinary variance into a red suite.
  - gate_answer_count_min: 1

  # NO INTERNAL FILENAME REACHES A DELIVERED DOCUMENT (harness 1.24.0 `artifact_text`).
  #
  # WHY THIS EXISTS. A leak of this class was shipped to a founder: an internal name appeared in
  # the delivered `report.json` and NOT in `report.md`, so the fix looked complete. The rule that
  # follows is "scan every delivered surface", which is why there is one entry per document below
  # rather than one for the report — `artifact` is a LITERAL PATH, not a glob, by design (a glob
  # would be an exhaustive claim over the manifest's file set, which this key cannot make).
  #
  # THE CARVE-OUT IS DELIBERATE AND NARROW. `metadata.produced_by` (and competitive-positioning's
  # `_produced_by`, hence the `_?`) is a provenance stamp in a machine-read artifact, ruled
  # legitimate 2026-08-18. Everything else matching `<name>.py` is a leak. The lookbehind is JS
  # regex — the harness compiles with `new RegExp(pattern, "i")`, so variable-width lookbehind is
  # available; note Python's `re` REJECTS this pattern, so a reproduce script needs a different form.
  #
  # SCOPE, AND WHAT IS DELIBERATELY NOT HERE:
  #   * `.html` is excluded — the brand theme's CSS custom properties (`--lool-azure`, `--font-body`)
  #     read as flags to a naive matcher, and the generated HTML bodies run 60-97 KB against the
  #     64 KiB body cap. `test_html_founder_text.py` scans HTML TEXT NODES structurally instead.
  #   * `checklist.json` is excluded — it carries a REAL, KNOWN leak of this class, logged at
  #     docs/internal/2026-08-18-checklist-json-founder-text-leak.md. Asserting here would red the
  #     lane on a defect that is tracked and deliberately not fixed in this change. Add it when
  #     that defect closes; until then this guard does NOT cover that surface.
  # Manifest-class: a body-less capture (over the cap, or a read-only/uploaded input) fails
  # EVIDENCE-UNAVAILABLE rather than passing, so this cannot green vacuously.
  - artifact_text:
      artifact: 'outputs/Cadence_Cap_Table.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/Cadence_Counsel_Packet.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/artifacts/cap-table-cadence/counsel_packet.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/artifacts/cap-table-cadence/report.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  # Delivery: the skill HANDED the deliverable over via `present_files`, not merely wrote it and named
  # a path.
  #
  # Requires harness >= 2.2.0: presence is the count of `present_files` invocations carrying a
  # well-formed `file_path`, read from the tool_use input's shape, so the host-path redaction policy
  # in cowork-tests/.cowork-redact.json cannot turn a real delivery into "never called". Below that
  # floor this key reads the classified `presentedFiles` list, which drops a redacted (non-absolute)
  # path, and reds on this cassette.
  #
  # NOT CI-ENFORCED YET. `replay` evaluates the assert block frozen in the cassette, never this file,
  # and the committed cassette predates this line; it freezes at the next re-record. Until then only
  # `replay --assert-from` checks it.
  #
  # KNOW WHAT IT DOES NOT CATCH: it is satisfied by the FIRST successful delivery call — no count, no
  # per-file match — so a PARTIAL delivery still passes. cowork-tests/delivery_check.py is the net for
  # that class; it reconciles tool_use against tool_result by id.
  - present_files_called: true
