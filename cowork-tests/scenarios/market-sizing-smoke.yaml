name: market-sizing-smoke
session: ../sessions/default.yaml
fidelity: cowork
on_unanswered: first   # gates here are immaterial to the asserts; option-1 is paraphrase-proof (anchor-discipline rule)
skills: [market-sizing]                # 0.5.0: scope the staleness hash to this skill + shared roots (F-6)

# Phase 1 fleet-parity smoke — market-sizing (conversational lane, Cadence).
# Goal: prove the resolver fix lands artifacts at outputs/artifacts/market-sizing-<slug>/ and the
# pipeline produces report.json. Rich prompt supplies name/stage/sector/geo so the founder-context gate
# is self-satisfied; on_unanswered: first backstops any single-select confirmation.
# NOTE (research-skill / §6): market-sizing does WebSearch and may cite public source domains — the
# privacy gate allowlist must cover any domain this run cites (extend cowork-replay.yml, documented).
# Slug + gate shape confirmed at the 0.24.0 discovery re-record.
prompt: |
  I'm the founder of Cadence, a US-based seed-stage B2B SaaS company selling field-service scheduling
  and dispatch software to small and mid-sized service businesses (HVAC, plumbing, electrical). Please
  use the market-sizing skill to build a full TAM/SAM/SOM analysis for Cadence — top-down and
  bottom-up — with a sensitivity test, and produce the written report. Keep all figures illustrative;
  where you would cite an external market source, label it clearly.

# ─────────────────────────────────────────────────────────────────────────────
# WHY SOME ASSERTS BELOW ARE AUTHORED BUT NOT FROZEN INTO THE CASSETTE
# (measured 2026-08-18; a re-record was attempted, paid for, and REFUSED)
#
# `present_files_called` CANNOT be recorded on this lane as it is currently configured, and the
# reason is structural rather than a skill defect. Measured on a real hostloop record:
#
#   1. The live run PASSED — `present_files` was called 3x and the run's own verdict was
#      pre-redaction pass=true. The skill delivers correctly.
#   2. At hostloop the `present_files` `file_path` is a REAL HOST PATH:
#        /Users/<user>/.cowork-harness/runs/<scenario>/<session>/work/session/mnt/outputs/<file>
#   3. `.cowork-redact.json` (this dir) rewrites every `/Users/...` prefix at record time — which is
#      exactly what it is for, and what keeps host paths out of committed cassettes.
#   4. The redacted path no longer resolves, so `present_files_called` flips true -> false, and
#      `record` REFUSES to write:
#        "redaction changed assertion failures: pre-redaction pass=true -> redacted pass=false;
#         failing assertions: [] -> [present_files_called] ... refusing to write a cassette whose
#         verdict was manufactured by redaction."
#      That refusal is CORRECT. A cassette that froze the redacted verdict would assert something
#      false forever.
#
# So host-path redaction and `present_files_called` are MUTUALLY EXCLUSIVE at hostloop fidelity.
# The assert stays on disk because it is TRUE and worth stating; it is simply not CI-enforced here.
# Delivery is independently witnessed in CI by `cowork-tests/delivery_check.py`.
#
# DO NOT "fix" this by deleting the assert (it is true and it documents the contract), by loosening
# `.cowork-redact.json` (it would commit this machine's host paths), or by re-running the record
# (it will fail identically and cost another paid run — this one already did).
#
# IT HAS NOW COST TWO. The 2026-08-20 1.25.0 refresh included this lane in its set without reading
# this header, and the record failed with the byte-identical refusal quoted above. The other four
# lanes in that batch recorded fine, so the loss was one lane's spend, not the batch. If you are
# assembling a re-record set: READ EACH SCENARIO'S OWN HEADER FIRST. A lane can be permanently
# unrecordable in its current configuration, and this file says so in the file itself.
#
# This lane consequently remains the ONLY cassette at harness 1.12.0, and the only one carrying the
# pre-1.14.0 `present_files` toolset. Neither is fixable by re-recording as configured — both need
# the fidelity decision below taken first.
# Resolving it needs a deliberate choice: record this lane at `fidelity: container`, where the
# delivered path is a sandbox path and not host-redacted, or drop the key in favour of
# `user_visible_artifact` + delivery_check.py. That decision is not taken here.
# ─────────────────────────────────────────────────────────────────────────────

assert:
  - result: success
  # Every planned step (TaskCreate/TaskUpdate) ran to completion — catches a run that produced
  # the deliverable but stranded steps, which result:success alone misses.
  - all_tasks_completed: true
  - file_exists: outputs/artifacts/market-sizing-cadence/report.json
  - artifact_json:
      artifact: outputs/artifacts/market-sizing-cadence/report.json
      path: coaching_payload.schema_version
      exists: true
  # Analytical sub-agents (top-down / bottom-up / sensitivity / checklist) were dispatched — guards
  # against a regression that collapses the per-step dispatch into the main thread.
  - subagent_dispatched: 'market-sizing'
  # Context-B coaching hand-off: the coaching sub-agent WRITES its commentary to the
  # handoff file (file transport, not the message channel) with a paired non-error
  # result — guards the first leg of the "## Coaching Commentary" insertion chain.
  # Tier-agnostic + replay-checkable. NOTE: the hand-off filename is `coaching.md`
  # (raw markdown, wrapped by md_to_commentary.py). It was
  # `coaching_commentary_output.json` when the current cassettes were recorded, so this
  # assert FAILS under `--reassert` until the next re-record and passes after it — the
  # same expected-until-re-record class as the `input_unmodified` upload guards.
  - subagent_file_write:
      path_suffix: coaching.md
  # Per-dispatch correlation: ties THIS dispatch's resolved type to ITS OWN delivered
  # write via parentToolUseId, which subagent_file_write (matching ANY sub-agent write)
  # cannot do.
  - subagent_dispatch_healthy:
      type: 'market-sizing'
  # host-path posture: hostloop exposes real host paths by design; the leak class is covered
  # by the container-tier host-path-canary scenario + the privacy scan's path class on cassettes.
  # --- fleet contract asserts (adopted at the 0.24.0 pin; budgets tightened from discovery actuals) ---
  # The pipeline entered through the Skill tool (prefix-tolerant; id shape confirmed at discovery).
  - skill_triggered: '(founder-skills:)?market-sizing$'
  # Every computer:// deliverable link must resolve, and at least one must be present. The strict
  # form is deliberate: the delivery step requires naming and linking each deliverable, so a run
  # with no link handed the founder unlabelled cards.
  - computer_links_resolve: true
  # No delete under outputs/ (live-lane key; replay skips it loudly).
  - no_delete_in_outputs: true
  # The skill HANDED the work over, rather than only writing it and naming a path. Served at container
  # AND hostloop, so it costs this cowork lane nothing — which is why the dedicated container scenario
  # was dropped rather than recorded (its one container-only key, `no_scratchpad_leak`, went vacuous
  # once the archive began landing in the deliverables directory: nothing is presented from the
  # scratchpad any more, so there is no promotion to verify).
  # KNOW WHAT THIS DOES NOT CATCH. It is satisfied by the FIRST successful delivery call, and the
  # handler's rejection is PER-CALL. The archive is offered on request, so it ships in its own later
  # call — a regression that presents it from an unpresentable path fails only that call, after this
  # key is already green. Nothing at any tier catches it here. The net for that class is
  # `delivery_check.py` in the post-batch sweep, which reconciles tool_use against tool_result by id
  # and reports an errored call separately. Do not treat this key as covering it.
  #
  # AND KNOW THAT IT IS NOT RUNNING. This key postdates the committed 1.12.0 cassette, and `replay`
  # evaluates the scenario FROZEN in the cassette, never this file -- the frozen block carries 16
  # asserts and this is not one of them. So CI's replay of this lane is green without ever checking
  # delivery; only `replay --assert-from` reads the block you are looking at, and there it FAILS
  # ("no file was delivered via present_files"). Everything the comment above says is true of what
  # this key WILL catch once the lane is re-recorded, and true of nothing today. Do not read the
  # green as coverage, and do not tighten the wording here expecting CI to notice.
  - present_files_called: true
  # Dispatch contract: sub-agents declare no Bash (agents/*.md) — regression tripwire.
  - subagent_tool_absent: 'Bash'
  # Usability budget: gates asked before value (observed + headroom, from discovery).
  - questions_count_max: 8
  # Author-chosen dispatch budget (production has NO Task-fan-out cap; this is an
  # efficiency tripwire, not a platform mirror). tightened from discovery actuals (observed x1.5).
  - dispatch_count_max: 8
  # Efficiency budgets — generous ceilings; tightened to observed x1.5 post-record.
  - max_turns: 125
  - tool_calls_max: 115
  # Stray-file guard (new-files-only; overwrite-in-place is covered by producer stamps).
  # Allowlist = artifact namespace (incl. handoff/**) + founder-context sidecar + promoted
  # deliverables. Pre-0.24 cassettes exclude loudly (no preRunPaths). tightened from discovery actuals (observed x1.5).
  - no_unexpected_files:
      - 'outputs/artifacts/market-sizing-cadence/**'
      - 'outputs/artifacts/founder-context-cadence.json'
      - 'outputs/Cadence_Market_Sizing.*'
  # GATE FLOOR. `questions_count_max` above is a CEILING — it caps interruption but has never once
  # asserted that the skill asked anything at all. A run that silently skips its confirmation gates and
  # assumes the answers produces a well-formed report, a green suite, and a founder who was never
  # consulted. Measured: a committed cassette for this fleet once froze exactly that (0 gates) and went
  # green for weeks. `gate_answers_delivered` alone does NOT close it — it passes VACUOUSLY when zero
  # gates fire, which is why the two are always paired.
  # Floor is deliberately 1, well BELOW the count observed at record time: gate firing is
  # model-dependent (the same batch saw one cap-table lane fire the founder-context pack and another
  # skip it), so a floor set AT the observed count converts ordinary variance into a red suite. This
  # asserts the property — "it asked" — not the model's exact behaviour.
  - gate_answers_delivered: true
  - gate_answer_count_min: 1

  # NO INTERNAL FILENAME REACHES A DELIVERED DOCUMENT (harness 1.24.0 `artifact_text`).
  #
  # WHY THIS EXISTS. A leak of this class was shipped to a founder: an internal name appeared in
  # the delivered `report.json` and NOT in `report.md`, so the fix looked complete. The rule that
  # follows is "scan every delivered surface", which is why there is one entry per document below
  # rather than one for the report — `artifact` is a LITERAL PATH, not a glob, by design (a glob
  # would be an exhaustive claim over the manifest's file set, which this key cannot make).
  #
  # THE CARVE-OUT IS DELIBERATE AND NARROW. `metadata.produced_by` (and competitive-positioning's
  # `_produced_by`, hence the `_?`) is a provenance stamp in a machine-read artifact, ruled
  # legitimate 2026-08-18. Everything else matching `<name>.py` is a leak. The lookbehind is JS
  # regex — the harness compiles with `new RegExp(pattern, "i")`, so variable-width lookbehind is
  # available; note Python's `re` REJECTS this pattern, so a reproduce script needs a different form.
  #
  # SCOPE, AND WHAT IS DELIBERATELY NOT HERE:
  #   * `.html` is excluded — the brand theme's CSS custom properties (`--lool-azure`, `--font-body`)
  #     read as flags to a naive matcher, and the generated HTML bodies run 60-97 KB against the
  #     64 KiB body cap. `test_html_founder_text.py` scans HTML TEXT NODES structurally instead.
  #   * `checklist.json` is excluded — it carries a REAL, KNOWN leak of this class, logged at
  #     docs/internal/2026-08-18-checklist-json-founder-text-leak.md. Asserting here would red the
  #     lane on a defect that is tracked and deliberately not fixed in this change. Add it when
  #     that defect closes; until then this guard does NOT cover that surface.
  # Manifest-class: a body-less capture (over the cap, or a read-only/uploaded input) fails
  # EVIDENCE-UNAVAILABLE rather than passing, so this cannot green vacuously.
  - artifact_text:
      artifact: 'outputs/Cadence_Market_Sizing.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
  - artifact_text:
      artifact: 'outputs/artifacts/market-sizing-cadence/report.md'
      not_matches: '(?<!"_?produced_by":\\s{0,4}")\\b\\w+\\.py\\b'
