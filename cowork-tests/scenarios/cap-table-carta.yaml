name: cap-table-carta
session: ../sessions/carta.yaml
fidelity: cowork
on_unanswered: first   # variance-gate backstop = option 1 (preserves the old catch-all); known gates label-pinned below (0.10.0 lint flags positional `choose: first` in answers)
skills: [cap-table]                # 0.5.0: scope the staleness hash to this skill + shared roots (F-6)

# P2-a — Lane-2 Carta XLSX extraction. Synthetic Carta multi-sheet export upload. Carta exports carry
# no founder identities or pool, so the cap structure is supplied inline to suppress the batched
# founder gate (which can include free-text fields the harness cannot answer); the note/qualified-financing/
# denominator/cap-base/scenario gates are label-pinned below, and on_unanswered:first backstops any others.
prompt: |
  I'm a founder at Cadence, a US Delaware seed-stage B2B SaaS company. My cap table: two founders,
  Maya Gold and Ofer Tal, splitting 8,000,000 common shares evenly (4,000,000 each), plus a
  1,000,000-share option pool (none issued yet). I've uploaded our Carta cap-table export of the
  convertible instruments. Please review it (map the Carta sheets to instruments) and give me the full cap-table review.

answers:
  # Label-pinned (exact option labels) on the option-1 choice the prior catch-all `first` recorded.
  - when_question: "cap base"
    choose: "Confirmed"
  - when_question: "convertible note"
    choose: "Convert at cap"
  - when_question: "qualified financing"
    choose: "$1,000,000"
  - when_question: "Company Capitalization|denominator"
    choose: "Fully diluted"
  - when_question: "scenarios should I model"
    choose: "Cap-implied SAFE snapshot"

assert:
  - result: success
  - file_exists: outputs/artifacts/cap-table-cadence/instruments.json
  - transcript_no_host_path: true
