name: Skill Quality

# Triggers:
# - pull_request: contract-tests only (free, fast). e2e is excluded by the
#   per-job `if:` to avoid unbounded $5-15/push cost while iterating on a PR.
# - push: tags ['v*']: every release tag runs the three end-to-end smokes.
#   Tag failure = delete tag, fix, retag (no user impact yet, since
#   sync-test-repo.sh is the actual distribution event — see CLAUDE.md
#   "Release Process" for the required ordering).
# - workflow_dispatch: manual on-demand. Use for pre-release validation on
#   a branch tip (`gh workflow run skill-quality.yml --ref <branch>`) or to
#   opt in for architectural-surface PRs (see CLAUDE.md for the trigger list).
#
# No `schedule:` trigger until Phase D body exists. A cron firing a no-op
# job would create green checkmarks for nothing — slow corruption of what
# CI green means.

# LEAST PRIVILEGE. Without this block every job here inherits the repository default, which
# is `write` across ALL scopes (`gh api repos/:owner/:repo/actions/permissions/workflow`).
# Nothing in this file needs to write anything; GitHub's own default for new repositories has
# been read-only since 2023 and this repo predates that. A job that genuinely needs more
# declares it itself — see `publish-release` in skill-quality.yml.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "founder-skills/**"
      - ".github/workflows/skill-quality.yml"
      - "pyproject.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  contract-tests:
    name: Contract + Cowork-invariant tests (free, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Repo uses pyproject.toml (no uv.lock); the default
          # `**/uv.lock` glob errors out on cache setup if no match.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --extra dev
      # `-m "not e2e"` is defensive: today none of these tests carry the e2e
      # marker, but it prevents accidental marker drift from making this job
      # slow + paid in the future.
      - run: |
          uv run pytest \
            founder-skills/tests/test_cowork_async_subagent_filter.py \
            founder-skills/tests/test_cowork_invariants.py \
            founder-skills/tests/test_skill_orchestration.py \
            founder-skills/tests/test_compose_invariants.py \
            -v -m "not e2e"
      # THE WHOLE FREE SUITE, because this job is what the paid lane and the release tag
      # depend on. The four files above are the skill-quality meta-checks; the gate
      # authorization tests, the ledger grammar and the reconciliation rules live
      # elsewhere, so a tag could go green having run none of them. `ci.yml` runs the full
      # suite on push and PR, which covers merges — it does not cover the tag path.
      - run: uv run pytest founder-skills/tests/ -q

  deck-review-e2e-smoke:
    # Job id kept as `deck-review-e2e-smoke` deliberately: it is the required status
    # check on the release tag, and renaming it would silently stop gating anything.
    name: end-to-end smoke, 3 skills (real LLM)
    runs-on: ubuntu-latest
    # Run on tag push and manual dispatch only. Per-PR is the wrong cadence
    # for a $5-15 / 12-15min job — opt in via `workflow_dispatch` from the
    # Actions UI when a PR touches architectural surface (see CLAUDE.md).
    # `pull_request` is excluded entirely by this guard, which also makes
    # forks structurally safe (they cannot push tags to upstream and lack
    # write access to dispatch this workflow).
    if: github.event_name != 'pull_request'
    needs: contract-tests
    # Tag-push: never cancel in-flight authoritative tag run if a quick
    # re-tag follows. workflow_dispatch on the same ref will queue the
    # second invocation behind the first ($20 worst case for double-fire,
    # accepted vs. the disaster of cancelling the authoritative run).
    concurrency:
      group: deck-review-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Preflight: on tag push, fail in <5s if the tag does not match
      # both plugin.json and pyproject.toml versions. Catches forgot-bump
      # and pyproject/plugin.json drift before the paid SDK call. This is
      # the version-bump enforcement that release.sh would have provided
      # if we'd added one — but in CI it survives rebase / cross-machine /
      # human-skipping the script.
      - name: Verify tag matches plugin.json + pyproject.toml versions
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PJ=$(jq -r '.version' founder-skills/.claude-plugin/plugin.json)
          PY=$(grep -E '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag:                   $TAG"
          echo "plugin.json version:   $PJ"
          echo "pyproject.toml version: $PY"
          if [ "$TAG" != "$PJ" ] || [ "$TAG" != "$PY" ]; then
            echo "::error::Tag $TAG does not match plugin.json ($PJ) or pyproject.toml ($PY). Bump both manifests, recommit, delete the tag, and retag."
            exit 1
          fi

      - name: Step summary
        run: |
          echo "### deck-review end-to-end smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exercises the deck-review skill end-to-end against a synthetic seed-stage fixture via the Claude Agent SDK." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Coverage scope:** 1 of 5 skills. The remaining 4 (market-sizing, ic-sim, financial-model-review, competitive-positioning) are covered by the free contract + Cowork-invariant tests in the per-PR job, not by end-to-end SDK exercise." >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --extra dev
      # Auth: pass BOTH possible secrets through; the SDK / `claude` CLI
      # picks whichever is set. Configure ONE of them in repo settings:
      #   - ANTHROPIC_API_KEY_CI       — per-token API billing (~$2-5/run)
      #   - CLAUDE_CODE_OAUTH_TOKEN_CI — subscription auth (flat monthly,
      #                                  but uses per-5-hour message cap;
      #                                  check Anthropic ToS for automated
      #                                  use at scale before relying on it)
      # Generate the OAuth token locally with `claude setup-token`, then
      # store the value as a repo secret.
      - run: |
          # All three paid lanes. deck-review alone left two of the three coaching
          # payload builders covered by contract tests only -- and a payload key the
          # sub-agent never reads is exactly what those lanes exist to catch, so the
          # contract tests cannot stand in for them. Cost scales with the count:
          # roughly $15-45 and 15-60 min for the three, against $5-15 for one.
          # They run sequentially; -x is deliberately NOT set, so one flaky lane
          # still reports the other two.
          uv run pytest \
            founder-skills/tests/test_e2e_deck_review.py \
            founder-skills/tests/test_e2e_financial_model_review.py \
            founder-skills/tests/test_e2e_market_sizing.py \
            -v -m e2e --tb=short -rs --junitxml=e2e-results.xml
        env:
          # THIS is the authorized place to spend, and it has to say so. The paid lanes
          # require an explicit opt-in because a credential alone once started billed runs
          # on a developer's Mac; that guard is correct, and it silently disabled THIS job
          # until the variable was set here. A safety fix that no-ops its own consumer has
          # moved the defect rather than removed it.
          RUN_PAID_E2E: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_CI }}
      # A SKIPPED LANE MUST NOT LOOK LIKE A PASSING ONE. pytest exits 0 on an all-skipped
      # run, so the missing opt-in above produced a green release gate that ran nothing.
      # Whatever the next reason for skipping turns out to be — a rotated secret, a marker
      # rename — the gate has to notice.
      - name: Fail if any paid lane was skipped
        if: always()
        run: |
          python3 - <<'CHECK'
          import sys, xml.etree.ElementTree as ET

          # THE EXACT THREE, BY NAME. Counting only skipped nodes let two passing lanes
          # masquerade as three: drop the `e2e` marker from one and it is silently not
          # collected, leaving a clean XML with two passes. "Zero skips" is not "everything
          # ran" unless you also say what everything is.
          EXPECTED = {
              "test_deck_review_smoke",
              "test_financial_model_review_smoke",
              "test_market_sizing_smoke",
          }
          # DELIBERATE OPT-OUTS, named one by one. A tag pays for one deck per skill; the
          # contradiction lane answers a different question (does a self-contradicting deck
          # reach the founder) and carries its own RUN_PAID_E2E_CONTRADICTION opt-in, so it
          # is skipped here by design. Naming it keeps "a skipped lane must not look like a
          # passing one" intact: an UNEXPECTED skip still reds, and adding a lane to this set
          # is a visible decision to stop gating on it rather than a silent omission.
          ALLOWED_SKIPS = {
              "test_deck_review_contradiction_lane",
          }
          suite = ET.parse("e2e-results.xml").getroot()
          cases = list(suite.iter("testcase"))
          ran = {c.get("name") for c in cases if c.find("skipped") is None}
          skipped = sorted(
              c.get("name")
              for c in cases
              if c.find("skipped") is not None and c.get("name") not in ALLOWED_SKIPS
          )
          missing = sorted(EXPECTED - ran)
          if skipped or missing:
              print(f"::error::paid lanes did not all run — skipped={skipped} missing={missing}")
              sys.exit(1)
          print(f"all {len(EXPECTED)} paid lanes executed")
          CHECK

  publish-release:
    # THE STEP FOUR RELEASES SILENTLY SKIPPED. A tag and a Release are different objects:
    # `git push --tags` creates only the tag, and nothing else here created the Release. So
    # v0.3.1, v0.6.0, v0.7.0 and v0.7.1 shipped with none, and the repo's "Latest" badge sat on
    # v0.4.7 for two months while the project kept shipping. Backfilled 2026-08-07; the MECHANISM
    # was never fixed, and CLAUDE.md documenting the step in full did not stop it recurring.
    name: Create the GitHub Release (tag runs only)
    runs-on: ubuntu-latest
    # ONLY a real tag push. `workflow_dispatch` can run on any ref, and `github.ref_name` would
    # then be a branch — publishing `main` as a version.
    if: startsWith(github.ref, 'refs/tags/v')
    # The Release must not exist before the paid gate is green. This is the ordering the manual
    # process encoded by hand.
    #
    # KNOWN TRADE, recorded rather than discovered later: that gate is measured as a coin flip
    # (docs/internal/2026-08-26-e2e-gate-is-a-coin-flip.md — fmr failed 2 of 4 runs on the same
    # fixture). Gating on it converts "someone forgot to publish" into "a flaky red withheld the
    # Release and nobody looked". That is the better failure — it is visible in the Actions tab and
    # a re-run fixes it — but it is a trade, not a free win, and fixing the flake is the real fix.
    needs: deck-review-e2e-smoke
    permissions:
      # NOT an escalation. The repo default is already `write` across ALL scopes
      # (`gh api repos/:owner/:repo/actions/permissions/workflow` -> "write"), and a job with no
      # block inherits that. Naming one scope here REDUCES this job's token.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          python3 - "$GITHUB_REF_NAME" > release-notes.md <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]
          ver = tag.lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Section runs to the next `## [` heading, so the last release in the file also matches.
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"::error::no CHANGELOG section for {ver} — refusing to publish empty notes")
          body = m.group(1).strip()
          if not body:
              sys.exit(f"::error::CHANGELOG section for {ver} is empty — refusing to publish it")
          sys.stdout.write(body + "\n")
          PY
          title=$(grep -m1 -F "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md | sed 's/^## //')
          [ -n "$title" ] || { echo "::error::no CHANGELOG heading for $GITHUB_REF_NAME"; exit 1; }
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag: abort if the tag is not on the remote, which is what a forgotten
          # `git push --tags` looks like. --latest is explicit because "Latest" is computed, not
          # chronological; correct here because this only ever runs on the tag just pushed.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --latest \
            --title "${{ steps.notes.outputs.title }}" \
            -F release-notes.md
