name: Skill Quality

# Triggers:
# - pull_request: contract-tests (free, fast) and branch-gate-selftest (free: runs the tag-time
#   check below against a known-green release and a made-up commit, under this job token). The
#   paid jobs are excluded by their `if:` to avoid unbounded $5-15/push cost on a PR.
# - workflow_dispatch: manual on-demand. Runs the three end-to-end smokes and the mutation
#   corpus, never publish-release. THIS is the paid release gate, run ONCE per release:
#   `gh workflow run skill-quality.yml --ref release/vX.Y.Z` runs it on the release branch
#   before main moves, because pushing main is what ships (the marketplace clone tracks main).
#   Also the opt-in for architectural-surface PRs (see CLAUDE.md for the list).
# - push: tags ['v*']: the tag, pushed after main, does NOT run the paid jobs again. It runs
#   contract-tests and verify-branch-gate (tag vs both manifests, the CHANGELOG's Scoring
#   changes section, and a green dispatched run of the paid jobs at this exact commit), then
#   publish-release creates the GitHub Release. A red verification is fixed by re-running its
#   failed jobs (free), which re-fires publish-release too.
#   OVERRIDE, when there is no branch run (a hotfix, or one made at another commit):
#   `gh workflow run skill-quality.yml --ref vX.Y.Z` runs the paid jobs at the tag's commit
#   (a dispatch never publishes); once green, `gh run rerun <tag-push run id> --failed`. A run
#   can be re-run only within 30 days of its first attempt, and a re-run executes the workflow
#   file at that run's own commit; past either, publish by hand with `gh release create`.
#   A real failure after main moved means keep the tag (the next release's Scoring-changes check
#   diffs from it), publish no Release, and release the next patch — never re-tag. See
#   CLAUDE.md "Release Process" for the full ordering.
#
# No `schedule:` trigger until Phase D body exists. A cron firing a no-op
# job would create green checkmarks for nothing — slow corruption of what
# CI green means.

# LEAST PRIVILEGE. Without this block every job here inherits the repository default, which
# is `write` across ALL scopes (`gh api repos/:owner/:repo/actions/permissions/workflow`).
# Nothing in this file needs to write anything; GitHub's own default for new repositories has
# been read-only since 2023 and this repo predates that. A job that genuinely needs more
# declares it itself — see `publish-release` in skill-quality.yml.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "founder-skills/**"
      - ".github/workflows/skill-quality.yml"
      # The tag-time check and the scripts publish-release runs: an edit to one alone must still
      # run contract-tests and branch-gate-selftest here.
      - ".github/scripts/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verify_release_notes_for:
        description: "Rehearse release-note extraction for this tag (e.g. v0.10.0). Publishes NOTHING."
        required: false
        type: string
      # The two opt-in deck-review lanes (contradiction, numeric operators), billed on top of the gate's
      # three. Read only by the paid job's env, never by an `if:`: off, the job is exactly the release
      # gate; on, the same job also runs both lanes, and a red one reds the job. verify-branch-gate
      # accepts ANY green dispatched run at the tagged commit, so dispatch the lanes as a separate
      # run from the gate's: a red lane then cannot cost the release its green gate run.
      extra_deck_lanes:
        description: "Also run the two opt-in deck-review lanes (contradiction, numeric operators). Adds ~$10-30."
        required: false
        type: boolean
        default: false

jobs:
  contract-tests:
    name: Contract + Cowork-invariant tests (free, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Repo uses pyproject.toml (no uv.lock); the default
          # `**/uv.lock` glob errors out on cache setup if no match.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --extra dev
      # `-m "not e2e and not mutation"` is defensive: today none of these four files carry
      # either marker, but a command-line `-m` overrides pyproject's `addopts`, so naming only
      # `e2e` would re-select the mutation corpus the moment one of them grew that marker.
      # The e2e half prevents accidental marker drift from making this job
      # slow + paid in the future.
      - run: |
          uv run pytest \
            founder-skills/tests/test_cowork_async_subagent_filter.py \
            founder-skills/tests/test_cowork_invariants.py \
            founder-skills/tests/test_skill_orchestration.py \
            founder-skills/tests/test_compose_invariants.py \
            -v -m "not e2e and not mutation"
      # THE WHOLE FREE SUITE, because this job is what the paid lane and publish-release
      # depend on. The four files above are the skill-quality meta-checks; the gate
      # authorization tests, the ledger grammar and the reconciliation rules live
      # elsewhere, so a tag could go green having run none of them. `ci.yml` runs the full
      # suite on push and PR, which covers merges — it does not cover the tag path.
      - run: uv run pytest founder-skills/tests/ -q

  mutation-corpus:
    name: Curated mutant corpus (cap-table)
    # DISPATCH ONLY: part of the paid release gate, run once on the release branch. Free, but a
    # ~3-minute structural check whose value is periodic, and the per-PR gate is already the thing
    # people wait on. It also runs on the free release-notes rehearsal dispatch. A tag push no
    # longer runs it: verify-branch-gate finds this job's green conclusion on the dispatched run at
    # the tagged commit, by its display name `name:` above (pinned by test_release_gating.py).
    # scripts/pre-tag.sh runs the same corpus locally before the branch is pushed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --extra dev
      # `-m mutation` is required, not decorative: pyproject's `addopts` deselects the marker, so
      # naming the file alone collects zero tests and reports green.
      - run: uv run pytest founder-skills/tests/test_mutation_corpus.py -v -m mutation

  deck-review-e2e-smoke:
    # THE DISPLAY NAME IS THE CONTRACT. The tag push no longer runs this job: verify-branch-gate
    # finds its green conclusion on the dispatched run at the tagged commit, and the jobs API
    # reports the display `name:` below, not this id. `REQUIRED_JOBS` in
    # .github/scripts/branch_gate_check.py holds the same string, and test_release_gating.py pins
    # the two equal, so a rename reds in the free suite instead of at tag time.
    name: end-to-end smoke, 3 skills (real LLM)
    runs-on: ubuntu-latest
    # Manual dispatch only. Per-PR is the wrong cadence for a $5-15 / 12-15min job — opt in via
    # `workflow_dispatch` from the Actions UI when a PR touches architectural surface (see
    # CLAUDE.md), and dispatch it once on the release branch as the paid release gate. A
    # `pull_request` or tag push never runs it; forks lack write access to dispatch.
    # `inputs.verify_release_notes_for == ''` keeps the FREE release-notes rehearsal free.
    # Without it, `gh workflow run skill-quality.yml -f verify_release_notes_for=vX.Y.Z`
    # also satisfied this guard and spent $15-45 on the paid e2e job — the rehearsal is sold
    # two screens down as a cheap safety net, which was true of publishing and false of cost.
    # The `inputs` read is reached only on a dispatch, where an input not passed is ''.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_notes_for == ''
    needs: contract-tests
    # Never cancel an in-flight run: a second dispatch on the same release
    # branch (after a fix was force-pushed) queues behind the first ($20 worst
    # case for double-fire, accepted vs. the disaster of cancelling the
    # authoritative run).
    concurrency:
      group: deck-review-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Step summary
        run: |
          echo "### deck-review end-to-end smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exercises the deck-review skill end-to-end against a synthetic seed-stage fixture via the Claude Agent SDK." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Coverage scope:** 3 of 6 skills exercised end to end (deck-review, financial-model-review, market-sizing). The remaining 3 (ic-sim, competitive-positioning, cap-table) are covered by the free contract + Cowork-invariant tests in the per-PR job, not by end-to-end SDK exercise." >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --extra dev
      # Auth: pass BOTH possible secrets through; the SDK / `claude` CLI
      # picks whichever is set. Configure ONE of them in repo settings:
      #   - ANTHROPIC_API_KEY_CI       — per-token API billing (~$2-5/run)
      #   - CLAUDE_CODE_OAUTH_TOKEN_CI — subscription auth (flat monthly,
      #                                  but uses per-5-hour message cap;
      #                                  check Anthropic ToS for automated
      #                                  use at scale before relying on it)
      # Generate the OAuth token locally with `claude setup-token`, then
      # store the value as a repo secret.
      - run: |
          # All three paid lanes. deck-review alone left two of the three coaching
          # payload builders covered by contract tests only -- and a payload key the
          # sub-agent never reads is exactly what those lanes exist to catch, so the
          # contract tests cannot stand in for them. Cost scales with the count:
          # roughly $15-45 and 15-60 min for the three, against $5-15 for one.
          # They run sequentially; -x is deliberately NOT set, so one flaky lane
          # still reports the other two.
          # test_e2e_cap_table.py is COLLECTED but not gated on: it carries its own
          # RUN_PAID_E2E_CAP_TABLE opt-in and is named in ALLOWED_SKIPS below, so a release
          # run does not pay for a fourth document. Collecting it anyway is the point — its
          # skip becomes VISIBLE in the XML, so "we have a cap-table lane" cannot quietly
          # become false the way an uncollected file would.
          # --basetemp pins pytest's tmp_path root to a known location so the "Upload e2e
          # review workspaces" step below can glob it. Without it pytest picks a fresh
          # /tmp/pytest-of-<user>-N dir per run with no stable name to glob. Safe: nothing
          # in the harness assumes the default layout -- locate_review_dir() resolves
          # workdir/"artifacts" from whatever tmp_path it is handed
          # (_e2e_harness.py:169,175-176).
          uv run pytest \
            founder-skills/tests/test_e2e_deck_review.py \
            founder-skills/tests/test_e2e_financial_model_review.py \
            founder-skills/tests/test_e2e_market_sizing.py \
            founder-skills/tests/test_e2e_cap_table.py \
            -v -m e2e --tb=short -rs --junitxml=e2e-results.xml \
            --basetemp "$RUNNER_TEMP/pytest"
        env:
          # THIS is the authorized place to spend, and it has to say so. The paid lanes
          # require an explicit opt-in because a credential alone once started billed runs
          # on a developer's Mac; that guard is correct, and it silently disabled THIS job
          # until the variable was set here. A safety fix that no-ops its own consumer has
          # moved the defect rather than removed it.
          RUN_PAID_E2E: "1"
          # "true" on a dispatch with `-f extra_deck_lanes=true`, which both lanes' opt-ins accept;
          # "false" otherwise, which neither does, so the lanes skip as named in ALLOWED_SKIPS below.
          RUN_PAID_E2E_CONTRADICTION: ${{ inputs.extra_deck_lanes }}
          RUN_PAID_E2E_NUMERIC: ${{ inputs.extra_deck_lanes }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_CI }}
      # `if: always()`, deliberately not `failure()`. A run that lands on a self-gated
      # not_applicable is a PASS (checklist.py records it, discloses it, and the gate
      # asserts the disclosure -- it does not assert the judgement never fires), and a
      # passing run's checklist.json is exactly the evidence that answers "why did the
      # assessor mark this criterion not applicable". Gating this on failure() would keep
      # evidence for the runs nobody needs it for and discard it for the runs that call
      # for a look. Do not "optimise" this back to `failure()`.
      #
      # The glob also catches deck-review's and market-sizing's workspaces, not just
      # financial-model-review's -- all three lanes share $RUNNER_TEMP/pytest as their
      # --basetemp root and all three inputs are synthetic fixtures, so publishing all
      # three is acceptable on a public repo.
      #
      # `if-no-files-found: ignore` is explicit rather than relied on as a default: a lane
      # skipped for missing auth writes nothing under artifacts/, and that must not red
      # this step -- "Fail if any paid lane was skipped" (below) is the step whose job it
      # is to catch that, not this one.
      - name: Upload e2e review workspaces (checklist/report artifacts, all lanes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-review-workspaces
          path: ${{ runner.temp }}/pytest/**/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
      # A SKIPPED LANE MUST NOT LOOK LIKE A PASSING ONE. pytest exits 0 on an all-skipped
      # run, so the missing opt-in above produced a green release gate that ran nothing.
      # Whatever the next reason for skipping turns out to be — a rotated secret, a marker
      # rename — the gate has to notice.
      - name: Fail if any paid lane was skipped
        if: always()
        run: |
          python3 - <<'CHECK'
          import sys, xml.etree.ElementTree as ET

          # THE EXACT THREE, BY NAME. Counting only skipped nodes let two passing lanes
          # masquerade as three: drop the `e2e` marker from one and it is silently not
          # collected, leaving a clean XML with two passes. "Zero skips" is not "everything
          # ran" unless you also say what everything is.
          EXPECTED = {
              "test_deck_review_smoke",
              "test_financial_model_review_smoke",
              "test_market_sizing_smoke",
          }
          # DELIBERATE OPT-OUTS, named one by one. A release run pays for one deck per skill; the
          # contradiction lane answers a different question (does a self-contradicting deck
          # reach the founder) and carries its own RUN_PAID_E2E_CONTRADICTION opt-in, so it
          # is skipped here by design. Naming it keeps "a skipped lane must not look like a
          # passing one" intact: an UNEXPECTED skip still reds, and adding a lane to this set
          # is a visible decision to stop gating on it rather than a silent omission.
          ALLOWED_SKIPS = {
              "test_deck_review_contradiction_lane",
              # deck-review's numeric-operators lane: its own RUN_PAID_E2E_NUMERIC opt-in. The only run
              # that shows the model proposing runway / inverse_change / implied_base from a real deck.
              # Both deck lanes run when a dispatch passes `-f extra_deck_lanes=true`.
              "test_deck_review_numeric_operators_lane",
              # cap-table's lane, same precedent: its own RUN_PAID_E2E_CAP_TABLE opt-in, run
              # on demand rather than per release. It exists to answer a question a release does not
              # ask — does the reliance boundary hold, and does a SKILL.md edit move
              # behaviour — and the release gate is already a measured coin-flip, so adding a
              # fourth billed document to it would trade reliability for coverage it does not
              # need. Naming it here keeps an UNEXPECTED skip red.
              "test_cap_table_smoke",
              # cap-table's pool-reading lane: its own RUN_PAID_E2E_CAP_TABLE_POOL opt-in. The only run that
              # reaches the unconfirmed pool-reading disclosure (the smoke lane's prompt names no pool).
              "test_cap_table_pool_reading_lane",
          }
          suite = ET.parse("e2e-results.xml").getroot()
          cases = list(suite.iter("testcase"))
          ran = {c.get("name") for c in cases if c.find("skipped") is None}
          skipped = sorted(
              c.get("name")
              for c in cases
              if c.find("skipped") is not None and c.get("name") not in ALLOWED_SKIPS
          )
          missing = sorted(EXPECTED - ran)
          if skipped or missing:
              print(f"::error::paid lanes did not all run — skipped={skipped} missing={missing}")
              sys.exit(1)
          print(f"all {len(EXPECTED)} paid lanes executed")
          CHECK

  verify-branch-gate:
    # WHAT THE TAG PUSH RUNS IN PLACE OF THE PAID JOBS. The paid gate runs once per release, on the
    # dispatched release-branch run; this job proves that run exists and passed, at exactly the
    # tagged commit, before publish-release may create the Release.
    name: Verify the paid gate passed at this commit (tag runs only)
    runs-on: ubuntu-latest
    # Byte-equal to publish-release's condition, so it can never be skipped while that job runs
    # (a skipped dependency would skip the Release). test_release_gating.py pins the equality.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # A job-level block REPLACES the top-level one, so `contents: read` is restated for checkout.
    # `actions: read` lets the job token list this workflow's runs and their jobs.
    permissions:
      actions: read
      contents: read
    # No `needs:`: it runs beside contract-tests and fails within a minute of the tag push.
    steps:
      - uses: actions/checkout@v4
        with:
          # The Scoring changes check below diffs from the previous release tag, and the default
          # shallow checkout fetches neither history nor tags. Without both it would fail (by design:
          # it never skips) on every tag push.
          fetch-depth: 0
          fetch-tags: true

      # Fail in seconds if the tag does not match both plugin.json and pyproject.toml versions.
      # Catches forgot-bump and pyproject/plugin.json drift. scripts/pre-tag.sh runs the same check
      # before the tag exists; this one survives rebase / cross-machine / skipping the script.
      - name: Verify tag matches plugin.json + pyproject.toml versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PJ=$(jq -r '.version' founder-skills/.claude-plugin/plugin.json)
          PY=$(grep -E '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag:                   $TAG"
          echo "plugin.json version:   $PJ"
          echo "pyproject.toml version: $PY"
          if [ "$TAG" != "$PJ" ] || [ "$TAG" != "$PY" ]; then
            echo "::error::Tag $TAG does not match plugin.json ($PJ) or pyproject.toml ($PY). Bump both manifests, recommit, delete the tag, and retag."
            exit 1
          fi

      # A DOWNSTREAM CONTRACT. A consumer reads every `### Scoring changes` section between two
      # versions to explain score changes, so the newest section must carry one, and must name each
      # skill whose pinned scoring files changed since the previous tag. Here, in the job that gates
      # `publish-release`. Tag pushes only; never per PR. scripts/pre-tag.sh runs the same check
      # before the tag exists.
      - name: Verify the CHANGELOG's Scoring changes section
        run: python3 .github/scripts/scoring_changes_check.py --tag "$GITHUB_REF_NAME"

      # The paid gate's evidence: a completed workflow_dispatch run of this workflow at this commit
      # whose latest attempt has both paid jobs (by display name) concluded `success`. The commit is
      # read from the checkout, not `github.sha`. The script fails closed on any API error; no step
      # or job here may carry `continue-on-error` (pinned by test_release_gating.py).
      - name: Verify a green paid-gate run exists at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/branch_gate_check.py --sha "$(git rev-parse HEAD)" --tag "$GITHUB_REF_NAME"

  branch-gate-selftest:
    # EXERCISES THE TAG-TIME CHECK BEFORE A RELEASE DEPENDS ON IT. verify-branch-gate runs only on a
    # tag push, so without this its restricted token, the live API calls and the failure path would
    # first run when a Release is on the line. Free: two read-only API queries.
    #
    # Pull requests only, and deliberately OUTSIDE publish-release's `needs` closure: a transient API
    # error here must never skip a Release.
    name: Self-test the tag-time paid-gate check (free)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: A released commit with a green branch run passes; a made-up commit does not
        env:
          GH_TOKEN: ${{ github.token }}
          # The base repository, explicitly: the runs live there, whatever the PR's head is.
          GH_REPO: ${{ github.repository }}
        run: |
          # v0.17.3, whose release-branch dispatch was green. Run records persist; if this one is
          # ever gone, or REQUIRED_JOBS is renamed, point it at a newer release made under the
          # current display names.
          python3 .github/scripts/branch_gate_check.py \
            --sha d4e337c4fe382b7d7ef55a7b55912c5258405367 --tag v0.17.3
          # Shaped so the shell's -e cannot mask it: a pass here is the failure. Its output is
          # captured and its `::error::` line defused, or the runner would file an error annotation
          # on every green PR for a rejection that is the expected result.
          if python3 .github/scripts/branch_gate_check.py \
               --sha 0000000000000000000000000000000000000000 --tag v0.0.0 >negative.log 2>&1; then
            cat negative.log
            echo "::error::the check accepted a commit with no runs"
            exit 1
          fi
          # A crash (an API error, a traceback) also exits non-zero; only the clean rejection counts.
          grep -q '^::error::no green paid-gate run at ' negative.log || { cat negative.log; echo "::error::the branch-gate check did not reject the made-up commit cleanly"; exit 1; }
          sed 's/^::error::/(expected) /' negative.log
          echo "made-up commit rejected, as it must be"

  publish-release:
    # THE STEP FOUR RELEASES SILENTLY SKIPPED. A tag and a Release are different objects:
    # `git push --tags` creates only the tag, and nothing else here created the Release. So
    # v0.3.1, v0.6.0, v0.7.0 and v0.7.1 shipped with none, and the repo's "Latest" badge sat on
    # v0.4.7 for two months while the project kept shipping. Backfilled 2026-08-07; the MECHANISM
    # was never fixed, and CLAUDE.md documenting the step in full did not stop it recurring.
    name: Create the GitHub Release (tag runs only)
    runs-on: ubuntu-latest
    # ONLY a real tag push. `workflow_dispatch` can run on any ref, and `github.ref_name` would
    # then be a branch — publishing `main` as a version.
    #
    # THE EVENT CHECK IS LOAD-BEARING AND WAS MISSING. `startsWith(github.ref, 'refs/tags/v')` is
    # satisfied by `gh workflow run ... --ref v0.11.0`, which is exactly how CLAUDE.md teaches
    # dispatch — so a dispatch on a tag ref published a real Release, and dispatching the *rehearsal*
    # that way published too. The comment above described the intent; only this line enforces it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The Release must not exist before the paid gate is green. The paid jobs ran once, on the
    # dispatched release-branch run; verify-branch-gate proves that run passed at this commit (both
    # paid jobs, by display name), and contract-tests runs the whole free suite on the tag.
    #
    # KNOWN TRADE, recorded rather than discovered later: the paid gate is measured as a coin flip
    # (docs/internal/2026-08-26-e2e-gate-is-a-coin-flip.md). Its flake risk now sits on the branch
    # run, before main moves, where a re-run costs a paid run and no version. On the tag, a missing
    # Release (the branch run still in progress, a transient API error) is fixed by a FREE re-run
    # of the failed jobs, which re-fires this job.
    #
    # This job's `if:` must never call a status function (`always()`, `success()`, `failure()`):
    # without one, a failed or skipped verification skips the Release. Pinned by
    # test_release_gating.py, with the whole `needs` closure.
    needs: [verify-branch-gate, contract-tests]
    permissions:
      # NOT an escalation. The repo default is already `write` across ALL scopes
      # (`gh api repos/:owner/:repo/actions/permissions/workflow` -> "write"), and a job with no
      # block inherits that. Naming one scope here REDUCES this job's token.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          # Same script the rehearsal job runs — one copy, so the rehearsal cannot drift from
          # the thing it is rehearsing. It exits non-zero on a missing or empty section.
          python3 .github/scripts/changelog-notes.py "$GITHUB_REF_NAME" > release-notes.md
          {
            echo "title<<EOF"
            python3 .github/scripts/changelog-notes.py "$GITHUB_REF_NAME" --title
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never interpolated into the `run:` string: a CHANGELOG heading containing a
          # quote or a backtick would otherwise break or inject at release time — the one moment
          # nobody wants to debug shell quoting.
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          # --verify-tag: abort if the tag is not on the remote, which is what a forgotten
          # `git push --tags` looks like. --latest is explicit because "Latest" is computed, not
          # chronological; correct here because this only ever runs on the tag just pushed.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --latest \
            --title "$RELEASE_TITLE" \
            -F release-notes.md

  verify-release-notes:
    # REHEARSE THE RELEASE PATH WITHOUT A TAG. `publish-release` first executes at the moment of a
    # release, which is the worst time to discover the extractor is wrong. This runs the SAME
    # script on demand and prints what would be published.
    #
    # It cannot publish, by construction and not by discipline: it inherits the file's top-level
    # `contents: read`, declares no elevation, and contains no `gh release` call. So a mistake here
    # cannot become an accidental Release.
    name: Rehearse release notes (publishes nothing)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_notes_for != ''
    steps:
      - uses: actions/checkout@v4
      - name: Extract and show
        env:
          # Via env, never interpolated into the `run:` string — a dispatch input containing a
          # quote would otherwise break out of the shell command with the job token in hand.
          VERIFY_TAG: ${{ inputs.verify_release_notes_for }}
        run: |
          tag="$VERIFY_TAG"
          title=$(python3 .github/scripts/changelog-notes.py "$tag" --title)
          python3 .github/scripts/changelog-notes.py "$tag" > notes.md
          {
            echo "## Would publish for \`$tag\`"
            echo "**Title:** $title"
            echo "**Notes:** $(wc -c < notes.md | tr -d ' ') bytes"
            echo '---'
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
