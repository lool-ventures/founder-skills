name: cowork-replay

# Token-free, agent-free PR gate for the fleet cowork-harness cassettes, built on the packaged
# cowork-harness GitHub Action (0.22.0+). Four gates, each rendering a verdict table into the
# PR job summary:
#   1. lint            — scenario no-silent-false-green invariants
#   2. privacy gate    — HARD: PII/host-path scan (PII only — --skip-staleness AND
#                        --skip-scenario-drift, so only a real PII finding fails the job).
#                        Includes the email CANARY (inverted check — must trip; plain step below).
#   3. staleness gate  — WARN: --skip-privacy under continue-on-error. A skill edit re-stales the
#                        affected cassette(s) and CI can't re-record, so this stays warn-not-fail.
#                        `fileSigs` names the exact changed file — a real drift points at the file.
#                        Re-record on a cadence (see cowork-tests/README.md).
#   4. replay          — content + manifest-backed file_exists/artifact_json across the whole dir.
# No model tokens, no Docker, no staged agent binary → runs on a stock GitHub-hosted runner.
#
# Version policy: **PINNED EXACTLY at 3.0.0 as of 2026-08-30** — see the block at the `npm i -g` site
# below for why the caret was retired. The paragraphs that follow are the FLOOR-ERA history, kept
# because each explains why a given step depends on a version at all; read every `^1.x` in them as a
# historical reason, NOT as the current value. There are TWO independent CLI sources here:
#   * the `replay` job's `uses: ...@v1` steps — the CLI comes from the packaged Action, which installs
#     it from its own `version:` input (default `latest`). **Every step in this job now carries the
#     floor.** The two verify-cassettes steps used to ride `latest` because they worked on any 1.x;
#     that stopped being true at 1.16.0, because they READ the cassettes and a v11 cassette is refused
#     by an older CLI (see THE FLOOR below). `replay` is the same case. The `lint` step carries it for
#     an older, unrelated reason: it passes
#     `--min-severity`, which needs >=1.11.0. Without that floor a
#     `latest` that resolved older would not degrade — it hard-fails, exit 2, "unrecognized arguments".
#     ALL FOUR carried `^1.20.0` at the time, each for its own reason — this is not a blanket bump;
#     all four are now the exact `3.0.0`. NOTE the
#     four sites are LINT / PRIVACY / STALENESS / REPLAY. The email canary is NOT one of them: it is a
#     bare `run:` step with no `version:` input, riding whatever CLI the preceding Action step
#     installed. Enumerate with `grep -n 'version: "' ` before editing this list — a plan-stage draft
#     listed the canary and omitted the staleness gate.
#       - Privacy gate: LOAD-BEARING at 1.19.0. The allowlist no longer passes `--allow-host-inventory`
#         at all — 1.19.0 exempts a mounted plugin's own agents/skills automatically, so the regex was
#         deleted. On a 1.18.0 CLI that exemption does not exist and the same allowlist reds on 240
#         non-findings (MEASURED via `npx cowork-harness@1.18.0`: exactly 240, exit 1). This is the
#         inverse of the usual "an old CLI just lacks a flag" case — it fails loudly and WRONGLY.
#       - Staleness gate: reads the cassettes, same v11-refusal reasoning as the privacy gate.
#       - Lint: LOAD-BEARING at 1.20.0, and this step also gained `strict: true` there. The
#         `vacuous-gate-assert` rule arrived in 1.18.0 (on an older CLI it silently does not run —
#         itself a vacuous gate), but 1.20.0 fixed it FOUR ways, two of them silent false-greens:
#         `gate_answer_count_min: 0` was accepted as a presence companion though `delivered >= 0`
#         always holds, and a wrong-case `tool_called` glob silenced the rule. It also stopped firing
#         on `gate_answers_delivered: false` (inverted premise) and on valid globs. Separately 1.20.0
#         adds `assert-contradiction` (ERROR) for pairings no run can satisfy. Without `strict: true`
#         the WARN-class half of that is ungated — see the step's own comment.
#       - Replay: gate option-label fingerprinting rides the existing `skill` drift class (1.18.0);
#         1.19.0 adds the `mutation` JSON envelope and the corrected `--mutate` sample reporting.
#     `^1.17.0` happened to RESOLVE to 1.18.0 (npm picks the highest 1.x), so that bump was not a live
#     breakage — but it did not EXPRESS the requirement, and would have fallen back silently if
#     1.18.0 were ever yanked. The 1.19.0 bump is NOT in that category: with the allow deleted, a
#     resolved-older CLI produces 240 false findings rather than degrading quietly.
#     (A RANGE in that input is DOCUMENTED as of harness 1.12.0 — `action.yml` now states `version`
#     accepts an npm range, not only an exact pin. It was already mechanically sound: the value is
#     interpolated as `cowork-harness@$v` into `npm install --global`.)
#   * the `skill-static-analysis` job's standalone `npm i -g cowork-harness@3.0.0`.
#
#   PINNED EXACTLY AS OF 2026-08-27 — these five sites are SELECTORS (they decide which CLI runs a
#   gate), and they were carets until 2.4.0. The caret auto-adopted every upstream release into CI
#   with nobody choosing it: 2.4.0 was running in these gates before the adoption plan describing it
#   was written. Five steps here are gates that red on a rule the harness ADDED — `lint --strict`,
#   `analyze-skill --strict`, `lint-skill --strict`, the `record --dry-run` loader, and the PII
#   `verify-cassettes` — so an unrelated PR could go red with nothing in its diff to explain it.
#   2.4.0 is the existence proof: it added a `fidelity-defaulted` lint rule and a `replaced-builtin`
#   note class, and we were compliant BY LUCK (27 of 27 scenarios already named a tier).
#   Replay is the sharper edge: the scenario object is passthrough, so a mismatched CLI "can return
#   the OPPOSITE verdict with no signal" (test_cowork_cassette_replay.py's own words) — and a floor
#   cannot cap that in the newer direction. Upstream agrees: `action.yml` says the `latest` default
#   exists so copy-paste recipes track the release, and "for reproducible CI, pin an exact version".
#   Cost is ~zero: the recording floor already moves nearly every release, so this is one more line
#   in a commit that was happening anyway.
#
#   RAISE THESE DELIBERATELY, as part of an adoption pass — never to chase a red.
#   WHAT IS **NOT** PINNED, and must stay a floor: `_MIN_HARNESS` in
#   founder-skills/tests/test_cowork_cassette_replay.py (raising it converts a below-floor
#   developer's RED into a silent SKIP) and `rerecord.sh`'s recording floor. Those answer a
#   different question — "is this CLI new enough for the check to mean anything" — than a selector's
#   "which CLI runs". Collapsing the two is the error. See
#   docs/internal/2026-08-27-cowork-harness-2.4.0-adoption-plan.md §7.4-7.5.
#   (A RANGE is still accepted in the Action's `version` input — documented since harness 1.12.0 —
#   so reverting to a caret is mechanically possible; it is a posture decision, not a limitation.)
# THE FLOOR WAS 1.25.0 (historical — the sites are now PINNED at 3.0.0). Five reasons, and they
# raised the floor for different steps:
#   (0'') 1.25.0 — CI HYGIENE ONLY, deliberately. `^1.24.0` already resolves to 1.25.0, so CI was
#       running it before this pin moved; nothing CI executes reads a surface 1.25.0 changed.
#       MEASURED: no new assertion keys (`git diff v1.24.0..v1.25.0 -- src/assert.ts` is EMPTY; the
#       catalog is 77 keys either side), no enum change, `CASSETTE_VERSION` still 11 /
#       `MIN_SUPPORTED` still 9 — so unlike (0') below, a developer pinned at 1.24.0 gets a GREEN
#       `pytest -m cowork`, not a red one. The pin is moved so the repo states one floor rather than
#       two. The load-bearing 1.25.0 requirement is on RECORDING (`rerecord.sh`), where the new
#       baseline repoints the host-loop sub-agent system prompt — see that file's floor note and
#       docs/internal/2026-08-20-cowork-harness-1.25.0-adoption-plan.md.
#       One caveat the "nothing CI reads changed" claim needs: `verify-cassettes` DOES read
#       `KNOWN_BUILTIN_SKILLS`, which 1.25.0 grew from 1 name to 15. MEASURED for us: 0 -> 0
#       findings, because our only bare name (`deep-research`) was already in the old roster.
#   (0') 1.24.0 — THE SCENARIOS NO LONGER LOAD BELOW IT, and this is a LOADER requirement, not a
#       lint one. `deck-review-gate-stop` now asserts `file_absent` and `question_options` (both
#       added in 1.24.0). MEASURED against `npx cowork-harness@1.23.0`:
#         * `record --dry-run` (the LOADER — the "Scenario load check" step below) HARD-REJECTS:
#           `Unrecognized key: "file_absent"`.
#         * `lint` on the same file reports `0 error(s), 2 warning(s)` and exits 0 — it is the
#           LENIENT surface and does NOT catch this. So do not read a green lint as proof the
#           floor is satisfied; that is the standing "lint is lenient, the loader is strict"
#           split, demonstrated live.
#       The same applies to REPLAY once the key is written into a cassette: a frozen assertion key
#       an older CLI does not know is hard-rejected (`cassetteVersion` does NOT bump — it stays 10
#       — so the version field gives no warning). Consequence beyond CI:
#       `founder-skills/tests/test_cowork_cassette_replay.py::_require_harness` skips only when the
#       CLI is ABSENT. A developer pinned BELOW the floor gets a SKIP, not a red — `_require_harness`
#       calls `pytest.skip`. So a below-floor local suite reports green-with-skips, and the floor is
#       not self-enforcing there; CI installs the floor explicitly instead.
#       1.24.0 also adds an ERROR-class `file-absent-contradiction` lint rule (gates without
#       `--strict`) and a pre-spend cassette-portability preflight folded into `record --dry-run`.
#       See docs/internal/2026-08-18-cowork-harness-1.24.0-adoption-plan.md.
#   (0) 1.20.0 — RECORDING FIDELITY, and the reason `rerecord.sh` floors here too. Its baseline
#       (desktop-1.26832.0) pins agent ELF 2.1.222, the only ELF installed on the recording machine. A
#       1.19.0 CLI (baseline desktop-1.25927.0, pinned 2.1.221) still records, but `doctor --tier
#       hostloop` reports `sha256 ✗ vs baseline` / `patch-tolerated`, freezing an ELF mismatch into
#       every cassette; at 1.20.0 the same check reads `sha256 ✓`. NOT a re-record trigger by itself:
#       an exhaustive recursive diff of the two baselines leaves spawn.tools/allowedTools/env/
#       promptTemplate/subagentAppend{,HostLoop}/hooks byte-identical, and network.allowDomains differs
#       in ORDER ONLY (set-difference empty both ways — a positional compare misreads it). 1.20.0 also
#       makes `record --dry-run` refuse what the real record refuses (the "Scenario load check" step
#       below now catches `assert-contradiction` and `on_unanswered: prompt` in a DIRECTORY batch, both
#       previously green there) and report the batch cost estimate on stderr without bisecting
#       `--max-budget-usd`. See docs/internal/2026-08-07-cowork-harness-1.20.0-adoption-plan.md.
#   (a) 1.17.0 — RECORDING correctness on the remote lane. Before it, `undelivered_deliverables` fired on
#       EVERY `lane: remote` run: the `presentedFiles` arm can never match there (no remote delivery tool
#       is served, so the array is structurally empty), so a run that wrote a file still warned "never
#       reached the user". A `deliveryObservable()` predicate now gates it, and the new
#       `delivery_unobservable` warn states the gap instead of guessing. Recording below 1.17.0 freezes a
#       warn set that asserts something false. 1.17.0 also adds plugin HOOK findings to `lint-skill`/`run`
#       (`hooks-json-misplaced` / `hook-event-unknown` / `hook-event-not-served`) — verified clean here,
#       since this plugin declares its SessionStart hook inline in plugin.json, not as a hooks/hooks.json.
#       1.17.0 adds NO re-record debt: the pinned baseline's `spawn.tools`/`allowedTools`/`env`/
#       `promptTemplate`/`subagentPrompt`/`options`/`effortDefault` are byte-identical to 1.16.0; its only
#       baseline addition is a `hooks` object the harness itself labels a DRIFT TRIPWIRE, not an
#       emulation source (`served: true` on PreToolUse:Task alone, which was already installed).
#   (b) 1.16.0 — READING the cassettes, still the reason the floor cannot go BELOW 1.16.0. 1.16.0 stamps a
# cassette whose scenario carries `lane: remote` at cassette format **v11**. An older CLI does not
# silently mis-score such a cassette (the 1.14.0/1.15.0 hazard) — it REFUSES that file and the
# invocation exits non-zero. So from the moment `market-sizing-remote-lane` is recorded, every step that
# READS `cowork-tests/cassettes/` genuinely requires >=1.16.0. The conditional stamp is value-aware:
# `lane: local` / omitted still stamps v10, so every other cassette is unaffected (measured 2026-08-06:
# 20 of 21 at v10, `market-sizing-remote-lane` the sole v11 — this line previously said "the other 16",
# a count that had drifted; derive it from the cassettes rather than inheriting it here).
# Earlier floors, kept as history: 1.14.0 served `present_files` at hostloop (the tier our cassettes
# record at) and added `lane:`, which an older LOADER rejects outright — that is what the "Scenario load
# check" step depends on. 1.12.0 fixed a bug that made an UPLOAD-BEARING scenario impossible to record
# while still spending the paid run (five scenarios here are upload-bearing); 1.11.0 stamps
# `environment.harnessVersion` into every cassette it records; 1.10.0 is the first release whose sandbox
# declares the skill/plugin discovery SDK-MCP servers (`mcp__skills__*` / `mcp__plugins__*`).
# WHICH FLOORS HAVE TEETH: `rerecord.sh`'s (recording bakes the version into the artifact, and is what
# stamps v11 in the first place); the load check's, once a `lane:` scenario exists; and — once a v11
# cassette is committed — `replay`'s and both `verify-cassettes` steps'. The `lint` step's stays
# documentary: it resolves no baseline and emits no staleness. The local replay lane
# (`founder-skills/tests/test_cowork_cassette_replay.py`) SKIPS rather than replay under semantics it
# cannot trust, so its `_MIN_HARNESS` must track a floor — but the READ floor (1.16.0, the v11 cassette
# stamp), NOT the record floor above. They are deliberately different numbers: 1.17.0 is required to
# RECORD correctly (the remote-lane warn fix) and nothing about it changes how an existing cassette
# REPLAYS, so pinning the read path at 1.17.0 would skip the local lane on a CLI that reads it fine.
# Raise `_MIN_HARNESS` only when a release changes cassette READ semantics.
# Tracking-forward is safe because SPEC.md §12 freezes the COVERED surfaces across the 1.x line — CLI +
# exit codes, every schema, and this Action's inputs/outputs — so a break to any of them needs a major
# bump; only UNCOVERED surface (human-readable text output) can shift within 1.x, and this gate's
# assertions are structural (they don't byte-compare that text). TRADEOFF: a new harness 1.x release can
# still change this gate's result with no repo change — re-run a failing job to tell a real drift from a
# harness update, and see cowork-tests/README.md's version note for the current state. CAVEAT: `@v1` and
# `^1.12.0` both stay on 1.x, but the Action's default `latest` input would follow a future 2.0 major
# (outside the §12 contract) — revisit at the 2.0 boundary.
#
# The LIVE lane (recording cassettes) needs the staged Cowork agent binaries (not redistributable,
# not on hosted runners) → self-hosted/local only. See cowork-tests/README.md + rerecord.sh.

# LEAST PRIVILEGE. Without this block every job here inherits the repository default, which
# is `write` across ALL scopes (`gh api repos/:owner/:repo/actions/permissions/workflow`).
# Nothing in this file needs to write anything; GitHub's own default for new repositories has
# been read-only since 2023 and this repo predates that. A job that genuinely needs more
# declares it itself — see `publish-release` in skill-quality.yml.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'founder-skills/skills/**'
      - 'founder-skills/agents/**'
      - 'founder-skills/scripts/**'
      - 'founder-skills/references/**'
      - 'cowork-tests/**'
      - '.github/workflows/cowork-replay.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The privacy allowlist is a bash array in privacy-allowlist.sh (single source of truth,
      # shared with rerecord.sh — the gate and the canary can never drift apart). The Action's
      # extra-args input word-splits, so an allowlist entry containing a literal space would
      # silently corrupt the flag vector — guard first, then flatten.
      - name: Flatten privacy allowlist for the action
        id: allow
        run: |
          source cowork-tests/privacy-allowlist.sh
          for a in "${ALLOW[@]}"; do
            case "$a" in *" "*)
              echo "::error::privacy-allowlist entry contains a literal space; the action's extra-args word-splits: $a"
              exit 1 ;;
            esac
          done
          echo "args=${ALLOW[*]}" >> "$GITHUB_OUTPUT"

      # `--min-severity WARN` drops the INFO floor from this gate's output. What it mutes today is
      # exactly two rules, both emitted UNCONDITIONALLY (17 + 17 = all 34 of our INFOs):
      # `manifest-needs-snapshot` and `gate-needs-controlout`. The linter is static — it cannot read a
      # cassette to know whether they apply — so they fire on every run and bury signal: a genuinely new
      # WARN would otherwise land in a 34-line INFO wall nobody reads. It can never mask an ERROR (the
      # severity filter runs before the exit computation, and ERROR is above the floor).
      # NOT free of cost: `positional-choose-order` is an existing, scenario-FIXABLE INFO rule that
      # would also be muted the moment a scenario used a positional `choose:`. That advisory class is
      # recovered at every re-record — rerecord.sh's own `lint` step keeps the default INFO floor, which
      # is when "re-record so these evaluate" is actually actionable.
      # `version:` is required here, not decorative: `--min-severity` needs >=1.11.0 and a pre-1.11.0
      # CLI hard-fails (exit 2, "unrecognized arguments"), so this step cannot ride the Action's default
      # `latest`. See the header's version policy.
      - name: Lint scenarios (no silent false-greens)
        uses: yaniv-golan/cowork-harness@v3
        with:
          command: lint
          path: cowork-tests/scenarios/
          version: "3.0.0"
          # `strict: true` is the Action's first-class input (action.yml `inputs.strict` -> `--strict`),
          # not `extra-args`. WITHOUT it this step CANNOT fail on a WARN-class rule — measured: a WARN
          # finding exits 0 bare and 1 under --strict, while an ERROR (`assert-contradiction`) exits 1
          # either way. So `vacuous-gate-assert` — the rule 1.20.0 fixed four ways — was ungated here.
          # This is the invocation upstream's own references/ci-recipe.md teaches; we had adopted half
          # of it. --strict changes the EXIT computation, not the severity floor, so the deliberate
          # INFO-wall muting below is unaffected (the filter runs before the exit computation).
          # Do NOT copy `strict: true` onto the replay steps: there it also fails on any cassette
          # STALENESS finding, which is WARN-only by design here (CI cannot re-record).
          strict: true
          extra-args: "--min-severity WARN"

      # The PII guard that actually matters here is **synthetic-only recording**: every cassette's
      # subject is a fictional company (Cadence / Acmecorp), so no real founder/company data exists
      # to leak. The allowlist tunes the scanner classes with CLASS-SCOPED flags (an allow can't
      # bleed across classes): currency (synthetic dollar figures), domain (public third-party
      # citations, wholesale), email (ONLY the synthetic acmecorp.com / example.com — any other
      # email FAILS the gate: the live PII tripwire), path/machine-inventory (no allows — a local
      # path or machine detail in a cassette is always a leak; record-time redaction via
      # cowork-tests/.cowork-redact.json is the source-side counterpart).
      #
      # verify-cassettes has THREE independent classes: PII (privacy), staleness, and scenario-drift
      # (the on-disk scenario `assert:` block diverging from the block frozen in the cassette). This
      # HARD gate is PII-ONLY, so it skips BOTH non-PII classes — `--skip-staleness` AND
      # `--skip-scenario-drift`. Scenario-drift, like staleness, is only fixable by re-recording, which
      # CI can't do; it surfaces (WARN) in the staleness step below instead of reddening this gate.
      - name: Privacy gate (HARD)
        uses: yaniv-golan/cowork-harness@v3
        with:
          command: verify-cassettes
          path: cowork-tests/cassettes/
          version: "3.0.0"
          extra-args: "--skip-staleness --skip-scenario-drift ${{ steps.allow.outputs.args }}"

      # Email canary: the SAME allowlist must still FLAG a non-synthetic email. The check asserts an
      # [email] FINDING specifically (grep the scanner output), NOT a bare non-zero exit — so a
      # cassette-version-floor refusal, a read error, or any other failure reads as a BROKEN tripwire
      # (loud red), never as "tripped as expected." (A v1 canary silently fail-opened under 0.30.0's
      # v9 read floor exactly this way: the refusal exited non-zero and the old inverted check misread
      # it as the tripwire firing. Bump the canary envelope's cassetteVersion at every future floor
      # raise — see cowork-tests/README.md.) The CLI is already on PATH (the Action installs it).
      - name: Email canary (must flag an [email] finding)
        run: |
          source cowork-tests/privacy-allowlist.sh
          out="$(cowork-harness verify-cassettes cowork-tests/canary/email-canary.cassette.json --skip-staleness --skip-scenario-drift "${ALLOW[@]}" 2>&1 || true)"
          if echo "$out" | grep -q '\[email\]'; then
            echo "email canary tripped as expected — email tripwire is live."
          else
            echo "::error:: email canary did NOT flag an [email] finding — the PII tripwire is not firing (a version-floor refusal, an over-broad --allow-email, or a generic --allow matching the address). Scanner output:"
            echo "$out"
            exit 1
          fi

      - name: Staleness gate (WARN — does not fail the job; CI cannot re-record)
        continue-on-error: true
        uses: yaniv-golan/cowork-harness@v3
        with:
          command: verify-cassettes
          path: cowork-tests/cassettes/
          version: "3.0.0"
          extra-args: "--skip-privacy"

      # Floored, and NOT for a missing flag. An unknown top-level scenario key inside a frozen
      # cassette is carried but never consulted — replay reads that object as passthrough and
      # behaves as if the key were absent — so a below-floor CLI does not refuse the cassette,
      # it can return the OPPOSITE verdict with no signal. Frozen assertions ARE validated and
      # hard-reject, so this is not "replay validates nothing"; only the scenario object is loose.
      - name: Replay content + manifest-backed assertions (token-free)
        uses: yaniv-golan/cowork-harness@v3
        with:
          command: replay
          path: cowork-tests/cassettes/
          version: "3.0.0"

      # `cowork-tests/gate_prefix_check.py` and `delivery_check.py` are implemented and
      # unit-tested (`founder-skills/tests/test_gate_prefix_check.py` /
      # `test_delivery_check.py`) but were invoked nowhere until this step pair. Neither
      # is a scenario `assert:` — each script's own module docstring explains why: no
      # assertion in the harness vocabulary inspects emitted `AskUserQuestion` option
      # LABELS, and `present_files_called` is `z.literal(true)` ("at least one file"),
      # so it stays green across a PARTIAL-delivery regression. Both scripts read a run
      # dir's `events.jsonl`; CI never produces one (`replay` is a deterministic cassette
      # playback that never spawns an agent), so both now also accept a single committed
      # cassette file directly — its frozen `events` array holds the identical JSON-line
      # strings a live run writes, the same reading `leak_scan.py` already relies on for
      # the same reason (see each script's `_event_lines`/module docstring). No new
      # dependency: both are stdlib-only PEP 723 scripts, and ubuntu-latest's default
      # python3 already satisfies their `>=3.10` floor.
      #
      # `gate_prefix_check.py --at-most-one` is used for EVERY cassette here, not the
      # default exactly-one: the fleet mixes CONFIRM-gates (a legitimate no-change branch
      # always exists) with DATA-ENTRY gates (asking for a fact — jurisdiction, stage,
      # sector — where zero options carrying the token is correct, per the script's own
      # docstring). Exactly-one blind across a mixed fleet manufactures a false failure on
      # every data-entry gate; --at-most-one never does (0 or 1 carrying is fine) while
      # still catching both real violation classes regardless of gate kind: MORE than one
      # option carrying the token, and any MUTATING option wrongly carrying it. Measured
      # against all 21 committed cassettes with --at-most-one (2026-08-01): 19 PASS, 2
      # NOT-EXERCISED (no AskUserQuestion gate in that cassette) — zero violations, so this
      # is wired as a HARD gate; exit 2 (not-exercised) is informational, never a failure.
      - name: Gate no-change-prefix conformance (reserved-token contract)
        run: |
          set +e   # exit codes 1/2 are meaningful here; don't let errexit eat them
          fail=0
          for f in cowork-tests/cassettes/*.cassette.json; do
            out="$(python3 cowork-tests/gate_prefix_check.py "$f" --at-most-one --pretty 2>&1)"
            code=$?
            case "$code" in
              0) : ;;
              2) echo "· $(basename "$f"): no AskUserQuestion gate fired (not-exercised, not a failure)" ;;
              *)
                echo "::error::$(basename "$f") violates the no-change-prefix contract:"
                echo "$out"
                fail=1
                ;;
            esac
          done
          exit "$fail"

      # WARN, not hard-fail — unlike the gate above, this one is NOT clean today. Three of
      # the 21 committed cassettes already read [undelivered]/[incomplete]:
      # ic-sim-smoke / market-sizing-smoke were recorded at harness 1.12.0, before 1.14.0
      # started serving `present_files` at the hostloop tier this fleet records at — a
      # documented, deferred re-record debt (see CHANGELOG / rerecord.sh's floor note), not
      # a defect introduced by any single PR. host-path-canary's gap is NOT explained by
      # that (container tier, recorded at harness 1.16.0, where `present_files` was always
      # served) and is a real, unexplained finding for whoever owns the cap-table
      # fast-assess Deliver step — this job cannot fix it (no re-record, no skill-script
      # edits authorized here) so it stays WARN rather than blocking every unrelated PR.
      # Ratchet to a hard gate once a re-record (or a skill fix) clears the known cases.
      - name: Delivery-completeness check (WARN — known pre-existing gaps, see comment)
        continue-on-error: true
        run: |
          set +e
          fail=0
          for f in cowork-tests/cassettes/*.cassette.json; do
            out="$(python3 cowork-tests/delivery_check.py "$f" --pretty 2>&1)"
            code=$?
            case "$code" in
              0) : ;;
              2) echo "· $(basename "$f"): NOT-EXERCISED (nothing produced/delivered by this cassette)" ;;
              *)
                echo "::warning::$(basename "$f") failed delivery-completeness:"
                echo "$out"
                fail=1
                ;;
            esac
          done
          exit "$fail"

  # Token-free static gate (latest 1.x analyzers) for the Cowork host-loop /sessions path-fidelity class
  # — the failure mode the Context A/B file-hand-off work fixed — plus skill-body footguns and a
  # self-heal `find` that targets the wrong skill. The single plugin-root scan covers every
  # contract-bearing file (all SKILL.md, agents/*, references/*, commands/*) — the OUTPUT_PATH /
  # file-write contracts live across all of them. No model, no Docker, no cassettes.
  #
  # analyze-skill's /sessions→file-tool heuristic can over-flag a *teaching* example. As of 0.32.0 a
  # directory/plugin-root target scans the UNION of contract-bearing markdown (references/, agents/,
  # commands/ INCLUDED — the old "references not scanned" carve-out is gone). Silence a genuine
  # teaching example with a SCOPED marker on the exact line/range — `analyze-skill: ignore-next-line`
  # or an `analyze-skill: ignore-start` / `ignore-end` fence — and reserve the file-wide
  # `analyze-skill: ignore` (silences the WHOLE file, blinding it to any other finding) as a last resort.
  skill-static-analysis:
    name: Skill static analysis (token-free path-fidelity + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 (Active LTS). The harness declares a Node >=22 floor as of 1.14.0 — 20 is EOL and
          # `doctor` fails on it. No job here runs `doctor`, so this is EOL hygiene, not a fix for a
          # break; `npm i -g` on 20 would only warn EBADENGINE.
          node-version: '24'
      - uses: actions/setup-python@v5   # lint-skill bundles scenario.py (needs python3)
        with:
          python-version: '3.12'
      - name: Install cowork-harness (pinned 3.0.0 — see header version policy)
        run: npm i -g cowork-harness@3.0.0
      # The LOADER is the strict surface, and nothing else in CI reaches it:
      #   * `lint` WARNS on an unknown/too-new top-level key and exits 0 (lenient by design);
      #   * `replay` evaluates the scenario FROZEN in each cassette and never reads the on-disk YAML;
      #   * the privacy gate runs --skip-scenario-drift, and the staleness gate is continue-on-error.
      # So without this step a scenario with a typo'd or too-new key passes every gate we have and
      # first fails at a PAID record. `record --dry-run` runs the real loader, is side-effect-free,
      # and needs no token, no Docker and no staged agent binary (verified under an empty HOME: it
      # reports both as absent and still exits 0). Exit 1 names each `✗ broken:` file; a single
      # broken file exits 2.
      # `--quiet` suppresses the readiness preview ONLY (functional as of 1.16.0; accepted-and-ignored
      # before it). It does NOT mute `✗ broken:` lines and does NOT change an exit code — so this step
      # is silent when green and loud and specific when not. Measured: 22 lines -> 0 on success.
      # Without it the preview prints per-scenario lines plus a token/agent readiness pair; on a runner
      # both read "(absent — fine for --dry-run; only a real record needs it)". Those are INFORMATIONAL
      # — 1.16.0 reworded them precisely because the older `✗ MISSING` form read as a broken pipeline.
      # Floor: `--dry-run` predates 1.14.0, but this step functionally requires >=1.14.0 now that a
      # `lane:` scenario exists (an older loader exits 2 on the whole directory), and `--quiet` needs
      # >=1.16.0 to do anything.
      - name: Scenario load check (token-free — lint warns, the loader rejects)
        run: cowork-harness record cowork-tests/scenarios/ --dry-run --quiet
      - name: analyze-skill --strict (whole plugin) + lint-skill --strict
        run: |
          # `bash -eo pipefail`; the `|| fail=1` accumulator keeps one finding from aborting the run
          # and hiding the rest. fail is initialised so `exit "$fail"` is always a real code.
          # analyze-skill --strict / lint-skill --strict → exit 1 on a finding. A plugin-root target
          # (0.32.0+) unions every contract-bearing file in one pass — no per-skill/per-agent loop.
          fail=0
          echo "::group::analyze-skill founder-skills/ (all SKILL.md + agents + references + commands)"
          cowork-harness analyze-skill founder-skills/ --strict || fail=1
          echo "::endgroup::"
          echo "::group::lint-skill --strict (all skills)"
          cowork-harness lint-skill founder-skills/skills/*/ --strict || fail=1
          echo "::endgroup::"
          exit "$fail"
