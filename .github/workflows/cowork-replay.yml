name: cowork-replay

# Token-free, agent-free PR gate for the fleet cowork-harness cassettes (cowork-harness >= 0.4.3):
#   1. lint            — scenario no-silent-false-green invariants (CLI subcommand since 0.4.0)
#   2. privacy gate    — HARD: PII/host-path scan (--privacy-only). A finding fails the job.
#   3. staleness gate  — WARN: --staleness-only under continue-on-error. The skillHash hashes the WHOLE
#                        founder-skills/ mount, so ANY skill edit re-stales EVERY cassette (F8); making
#                        staleness hard would force an 11-cassette re-record on every skill PR. So it
#                        surfaces drift without blocking; cassettes are re-recorded on a cadence /
#                        before release. (Re-record locally: see cowork-tests/README.md.)
#   4. replay          — content + manifest-backed file_exists/artifact_json across the whole dir.
# No model tokens, no Docker, no staged agent binary → runs on a stock GitHub-hosted runner.
#
# The LIVE lane (recording cassettes) needs the staged Cowork agent ELF (not redistributable, not on
# hosted runners) → self-hosted/local only. See cowork-tests/README.md.

on:
  pull_request:
    paths:
      - 'founder-skills/skills/**'
      - 'founder-skills/scripts/**'
      - 'founder-skills/references/**'
      - 'cowork-tests/**'
      - '.github/workflows/cowork-replay.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml          # cowork-harness lint needs python3 + PyYAML
      - run: npm i -g 'cowork-harness@>=0.4.3'

      - name: Lint scenarios (no silent false-greens)
        run: cowork-harness lint cowork-tests/scenarios/*.yaml

      - name: Privacy gate (HARD)
        # The PII guard that actually matters here is **synthetic-only recording**: every cassette's
        # subject is a fictional company (Cadence / Acmecorp), so no real founder/company data exists to
        # leak. Given that, the allowlist below tunes the default scanner classes:
        #   * currency — synthetic dollar figures the skills emit.
        #   * DOMAIN class — broadly allowed, but the regex is **anchored** (^...$) so it matches a
        #     bare-domain finding WHOLE and can NOT match the domain substring inside an email (an
        #     unanchored allow silently cleared every email, killing the tripwire below — caught in review
        #     2026-06-18). The research/coaching skills (market-sizing, comp-pos, deck-review) cite 150+
        #     PUBLIC third-party domains (competitor sites, market-research firms, VC resources): public,
        #     non-PII; a real leak would surface a real company NAME (caught by synthetic-only review) and
        #     a real EMAIL (caught below), not merely a domain. An enumerated 150-domain allowlist would be
        #     unmaintainable and flake on every re-record, so the domain class is allowed wholesale.
        #   * email — only the SYNTHETIC domains (acmecorp.com — fictional deck co; example.com — RFC-2606
        #     reserved, used by the synthetic Carta stakeholders) are permitted, anchored. Any other email
        #     (e.g. a real founder@realstartup.com) still FAILS the gate — the live PII tripwire.
        # The email tripwire is the one guard this posture leans on hardest, and it nearly died once
        # (an unanchored domain allow silently suppressed every email). So the SAME allowlist is reused
        # for an email CANARY below: a purpose-built cassette carrying a non-synthetic email
        # (analyst@realstartup.com) MUST trip. If it stops tripping, the tripwire is disabled and the job
        # fails. Defining $ALLOW once means the gate and the canary can never drift apart.
        run: |
          ALLOW=(
            --allow '\$\s*\d[\d.,]*\s*(?:[MmKkBb]|million|thousand|billion)?'
            --allow '^[A-Za-z0-9][A-Za-z0-9.\-]*\.[A-Za-z]{2,}$'
            --allow '^[A-Za-z0-9._%+\-]+@(?:acmecorp|example)\.com$'
          )
          # Real gate: committed cassettes must be clean under the allowlist.
          cowork-harness verify-cassettes cowork-tests/cassettes/ --privacy-only "${ALLOW[@]}"
          # Email canary: the SAME allowlist must still FLAG a non-synthetic email. If verify-cassettes
          # exits 0 here, the email class is no longer catching real addresses → fail loudly.
          if cowork-harness verify-cassettes cowork-tests/canary/email-canary.cassette.json --privacy-only "${ALLOW[@]}"; then
            echo "::error:: email canary did NOT trip — the email PII tripwire is disabled (a real email would pass). Check the allowlist anchoring (an unanchored domain allow suppresses emails)."
            exit 1
          fi
          echo "email canary tripped as expected — email tripwire is live."

      - name: Staleness gate (WARN — does not fail the job; see header F8)
        continue-on-error: true
        run: cowork-harness verify-cassettes cowork-tests/cassettes/ --staleness-only

      - name: Replay content + artifact_json assertions (token-free)
        run: cowork-harness replay cowork-tests/cassettes/ --output-format json
