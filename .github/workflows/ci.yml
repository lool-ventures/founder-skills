name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run mypy founder-skills/skills/market-sizing/scripts/
      - run: uv run mypy founder-skills/skills/deck-review/scripts/
      - run: uv run mypy founder-skills/skills/ic-sim/scripts/
      - run: uv run mypy founder-skills/skills/financial-model-review/scripts/
      - run: uv run mypy founder-skills/skills/competitive-positioning/scripts/
      - run: uv run mypy founder-skills/skills/cap-table/scripts/
      - run: uv run mypy founder-skills/tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest founder-skills/tests/ -v -m "not e2e"
      - run: uv run pytest evals/cap-table/ -v

  privacy:
    runs-on: ubuntu-latest
    name: Privacy leak guard (name-free)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      # Layers 1+2 only: stray confidential documents + named-after-company
      # provenance tags. The exact-name list (layer 3) is local-only and never
      # present in CI, so --no-names is the correct CI mode (no name disclosure).
      - run: uv run python scripts/privacy_guard.py --tree --no-names
      - run: uv run pytest scripts/test_privacy_guard.py -q

  validate:
    runs-on: ubuntu-latest
    name: Validate plugin & marketplace manifests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 reached EOL 2026-04-30 and receives no security patches. Unrelated to
          # cowork-harness (none runs in this job) — this installs the Claude Code CLI.
          node-version: "22"
      - name: Install Claude Code CLI (pinned exact)
        # claude plugin validate was introduced in CLI v2.1.131. We pin to
        # an exact version (not ^ or ~) so CI is deterministic — bump
        # intentionally via PR rather than accepting silent npm-side drift.
        run: npm install -g "@anthropic-ai/claude-code@2.1.138"
      - name: Print CLI version (traceability)
        run: claude --version
      - name: Validate plugin manifest
        run: claude plugin validate founder-skills
      - name: Validate marketplace manifest
        run: claude plugin validate .
