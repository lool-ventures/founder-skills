[project]
name = "founder-skills"
version = "0.6.0"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "python-docx>=1.2.0",
    "pdfplumber",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pyyaml", "types-openpyxl", "types-PyYAML", "claude-agent-sdk==0.1.80"]

[tool.ruff]
target-version = "py310"
line-length = 120
# docs/internal/ is gitignored; eval-set scripts embed long HTML/JS templates
# we don't want to lint. Excluding the whole tree.
extend-exclude = ["docs/internal/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML template embeds long JS lines inside raw string; line length not fixable
"founder-skills/skills/financial-model-review/scripts/review_inputs.py" = ["E501"]
# HTML/JS templates inline long lines we can't usefully wrap
"founder-skills/skills/cap-table/scripts/explore.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/visualize.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/compose_report.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/flip_scenario.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/priced_round.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/rule_audit.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["founder-skills/tests"]
python_files = "test_*.py"
pythonpath = ["founder-skills/tests"]
markers = [
    "e2e: end-to-end tests that invoke real LLMs (any of ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN / local `claude /login`; ~5-20 min wall time per run; ~$5-15 on API; subscription rate limits change — check Anthropic policy before using subscription for CI)",
    "cowork: token-free cowork-harness cassette replay via the shipped pytest helper (needs `npm i -g cowork-harness@^1.17.0`; no Docker/token — deterministic replay only). Auto-skips when the CLI is absent. Run with `uv run pytest -m cowork`.",
]
