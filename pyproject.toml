[project]
name = "founder-skills"
version = "0.11.0"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "python-docx>=1.2.0",
    "pdfplumber",
]

[project.optional-dependencies]
# mypy is PINNED, and must stay pinned. `uv.lock` is not committed, so CI's `uv sync --extra dev`
# resolves dev tools fresh on every run while a developer's venv keeps whatever it installed months
# ago. Unpinned, that let CI run mypy 2.3.0 against a local 1.19.1 — a MAJOR version apart — so
# `scripts/pre-tag.sh` reported "safe to tag" and the tag then failed CI on two `var-annotated`
# errors 1.19.1 does not emit. A preflight that cannot see what CI sees is not a gate. Bump this
# deliberately (and re-run the 7 mypy dirs) rather than letting it float.
# hypothesis is PINNED for the same reason as mypy, plus one of its own: property tests are only a
# regression gate if the examples are stable. `derandomize=True` (see tests/test_cap_table_properties.py)
# fixes the seed, but the GENERATOR is the library's -- a minor bump can change which examples are
# drawn, so an unpinned hypothesis turns "this property held" into "this property held on whatever
# examples CI happened to draw today", and a red would land on a commit that changed nothing.
dev = ["ruff", "mypy==2.3.0", "pytest", "pyyaml", "types-openpyxl", "types-PyYAML", "claude-agent-sdk==0.1.80", "hypothesis==6.165.10"]

[tool.ruff]
target-version = "py310"
line-length = 120
# docs/internal/ is gitignored; eval-set scripts embed long HTML/JS templates
# we don't want to lint. Excluding the whole tree.
extend-exclude = ["docs/internal/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML template embeds long JS lines inside raw string; line length not fixable
"founder-skills/skills/financial-model-review/scripts/review_inputs.py" = ["E501"]
# HTML/JS templates inline long lines we can't usefully wrap
"founder-skills/skills/cap-table/scripts/explore.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/visualize.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/compose_report.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/flip_scenario.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/priced_round.py" = ["E501"]
"founder-skills/skills/cap-table/scripts/rule_audit.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

# python-pptx is NOT a project dependency and deliberately so: it is needed only on the
# degraded PowerPoint path, where a PDF converter is unavailable. The script declares it in
# PEP 723 inline metadata for `uv run`, handles ImportError with an actionable message, and
# the target runtime (Cowork) ships it. Forcing it into `dependencies` would make every
# install carry a parser for a fallback most runs never take.
[[tool.mypy.overrides]]
module = ["pptx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# PAID LANES ARE DESELECTED BY DEFAULT. Registering the `e2e` marker never excluded it, so
# a plain `pytest` collected all three lanes and started real, billed runs. That is not
# hypothetical: an audit running the default suite on a macOS host began two paid
# market-sizing runs nobody had approved. Opting IN is one flag (`-m e2e`), which is the
# right side for the cost to sit on.
addopts = "-m 'not e2e and not mutation'"
testpaths = ["founder-skills/tests"]
python_files = "test_*.py"
pythonpath = ["founder-skills/tests"]
markers = [
    "e2e: end-to-end tests that invoke real LLMs (any of ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN / local `claude /login`; ~5-20 min wall time per run; ~$5-15 on API; subscription rate limits change — check Anthropic policy before using subscription for CI)",
    "mutation: curated mutant-corpus regression (test_mutation_corpus.py). Copies the repo to a temp dir, injects each named defect, and asserts the cap-table selection notices (or records that it does not). ~3 min (measured), deselected from the default suite; run with `uv run pytest -m mutation`. NOTE: a command line `-m` OVERRIDES addopts, so every explicit `-m \"not e2e\"` invocation must say `-m \"not e2e and not mutation\"` or it silently re-selects this lane.",
    "cowork: token-free cowork-harness cassette replay via the shipped pytest helper (needs `npm i -g cowork-harness@3.2.0` (exact, matching CI); no Docker/token — deterministic replay only). Auto-skips when the CLI is absent. Run with `uv run pytest -m cowork`.",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
